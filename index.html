<style>

<script>
'use strict';
/* ================= Firebase connection (project: database-55b53) =================
   This tracker keeps its own data in the cash_* collections only:
   cash_users, cash_banks, cash_txns, cash_audit, cash_settings. It never reads or changes the payroll data. */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {
  apiKey:"AIzaSyBfrdsMbfhQn4uF8HbZSkCx2kOLnNClfwY",
  authDomain:"database-55b53.firebaseapp.com",
  projectId:"database-55b53",
  storageBucket:"database-55b53.firebasestorage.app",
  messagingSenderId:"706968150921",
  appId:"1:706968150921:web:e25fb80011714f889cb758"
};
const DEMO = /[?&]demo\b/.test(location.search);
const C = {users:'cash_users', banks:'cash_banks', txns:'cash_txns', audit:'cash_audit', settings:'cash_settings'};

/* ================= Small helpers ================= */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const monthStart = () => today().slice(0,8)+'01';
const addDays = (iso,n) => {const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd = iso => iso ? `${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}, ${iso.slice(0,4)}` : '';
const fdt = iso => {if(!iso)return '';const d=new Date(iso);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}`};
const money = c => (Math.abs(c||0)/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const peso = c => ((c||0)<0?'−':'')+'₱'+money(c);
const plain = c => ((c||0)/100).toFixed(2);
function parseAmt(s){const t=String(s??'').replace(/[₱,\s]/g,'');if(!/^\d+(\.\d{0,2})?$/.test(t)&&!/^\.\d{1,2}$/.test(t))return NaN;return Math.round(parseFloat(t)*100)}
const nowISO = () => new Date().toISOString();
const clone = o => o==null?o:JSON.parse(JSON.stringify(o));
const noId = o => {const c={...o};delete c.id;for(const k of Object.keys(c))if(c[k]===undefined)delete c[k];return c};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(msg,err){const t=document.createElement('div');t.className='t'+(err?' err':'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),err?6000:3200)}
function errMsg(e){
  const c=String(e&&e.code||'');
  if(c.includes('permission'))return 'Firestore refused the request (permission denied). Add the cash_* rules from the README in Firebase → Firestore → Rules.';
  if(c.includes('unavailable')||c.includes('failed-precondition')&&/offline/i.test(e.message||''))return 'No connection to the database. Check the internet and try again.';
  return (e&&e.message)||String(e);
}
function csvDownload(name,rows){
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const blob=new Blob(['﻿'+rows.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ================= Data store: Firestore (live) or this-browser demo ================= */
function makeRemote(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const q=(col,where=[],o={})=>{let r=db.collection(col);for(const w of where)r=r.where(w[0],w[1],w[2]);if(o.orderBy)r=r.orderBy(o.orderBy[0],o.orderBy[1]||'asc');if(o.limit)r=r.limit(o.limit);return r};
  const wrap=s=>s.exists?{...s.data(),id:s.id}:null;
  return {
    listen(col,where,cb,onErr,o={}){return q(col,where,o).onSnapshot({includeMetadataChanges:!!o.meta},s=>cb(s.docs.map(d=>({...d.data(),id:d.id})),s.metadata),e=>onErr&&onErr(e))},
    listenDoc(path,cb,onErr){return db.doc(path).onSnapshot(s=>cb(wrap(s)),e=>onErr&&onErr(e))},
    async get(path){return wrap(await db.doc(path).get())},
    async getServer(path){return wrap(await db.doc(path).get({source:'server'}))},
    async query(col,where,o){const s=await q(col,where,o).get();return s.docs.map(d=>({...d.data(),id:d.id}))},
    set(path,d){return db.doc(path).set(d)},
    update(path,d){return db.doc(path).update(d)},
    del(path){return db.doc(path).delete()},
    newId(col){return db.collection(col).doc().id},
    inc(n){return firebase.firestore.FieldValue.increment(n)},
    tx(fn){return db.runTransaction(T=>fn({
      async get(p){return wrap(await T.get(db.doc(p)))},
      set(p,d){T.set(db.doc(p),d)}, update(p,d){T.update(db.doc(p),d)}, del(p){T.delete(db.doc(p))}
    }))}
  };
}
function makeLocal(){
  const KEY='cash-tracker-demo-v1';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const cmp=(a,op,b)=>op==='=='?a===b:op==='in'?b.includes(a):(a===null||typeof a!==typeof b)?false:op==='>='?a>=b:op==='<='?a<=b:op==='>'?a>b:op==='<'?a<b:true;
  const one=p=>data[p]?{...clone(data[p]),id:p.split('/').pop()}:null;
  const rows=(col,where=[],o={})=>{let out=[];for(const[p,v]of Object.entries(data)){const i=p.lastIndexOf('/');if(p.slice(0,i)!==col)continue;
      if(where.every(w=>v[w[0]]!==undefined&&cmp(v[w[0]],w[1],w[2])))out.push({...clone(v),id:p.slice(i+1)})}
    if(o.orderBy){const[f,dir]=o.orderBy;out.sort((a,b)=>(a[f]<b[f]?-1:a[f]>b[f]?1:0)*(dir==='desc'?-1:1))}
    return o.limit?out.slice(0,o.limit):out};
  const upd=(p,d)=>{if(!data[p])throw Object.assign(new Error('No document to update: '+p),{code:'not-found'});
    for(const[k,v]of Object.entries(d)){if(v&&typeof v==='object'&&'__inc'in v)data[p][k]=(data[p][k]||0)+v.__inc;else data[p][k]=clone(v)}};
  return {
    listen(col,where,cb,_e,o={}){const run=()=>cb(rows(col,where,o),{fromCache:false});subs.add(run);setTimeout(run,0);return()=>subs.delete(run)},
    listenDoc(path,cb){const run=()=>cb(one(path));subs.add(run);setTimeout(run,0);return()=>subs.delete(run)},
    async get(p){return one(p)}, async getServer(p){return one(p)},
    async query(col,where,o){return rows(col,where,o)},
    async set(p,d){data[p]=clone(d);save();notify()},
    async update(p,d){upd(p,d);save();notify()},
    async del(p){delete data[p];save();notify()},
    newId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)},
    inc(n){return{__inc:n}},
    async tx(fn){const backup=clone(data),ops=[];
      try{const r=await fn({get:async p=>one(p),set:(p,d)=>ops.push(['s',p,d]),update:(p,d)=>ops.push(['u',p,d]),del:p=>ops.push(['d',p])});
        for(const[t,p,d]of ops){if(t==='s')data[p]=clone(d);else if(t==='u')upd(p,d);else delete data[p]}
        save();notify();return r}catch(e){data=backup;throw e}}
  };
}
let Store;

/* ================= Passwords (salted PBKDF2-SHA256; the password itself is never stored) ================= */
const ITER=210000, enc=new TextEncoder();
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbkdf2(pw,salt,iter){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:iter},k,256))}
async function makeHash(pw){const salt=b64(crypto.getRandomValues(new Uint8Array(16)));return{salt,iter:ITER,hash:await pbkdf2(pw,salt,ITER)}}
const ctEq=(a,b)=>{if(!a||!b||a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0};
const userId=u=>String(u||'').trim().toLowerCase().replace(/[^a-z0-9_\-.@+]/g,'_');
function tempPassword(){const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(10));return Array.from(r,x=>A[x%A.length]).join('')}
const SESSION_KEY='ct-session',LOCK_KEY='ct-lock',IDLE_MS=30*60*1000,MAX_TRIES=5,LOCK_MS=5*60*1000;
const sessGet=()=>{try{const v=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');return v&&v.exp>Date.now()?v:null}catch(e){return null}};
const sessSet=(u,hs)=>{try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({u,hs,exp:Date.now()+IDLE_MS}))}catch(e){}};
const sessClear=()=>{try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}};
const lockGet=()=>{try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}')||{}}catch(e){return{}}};
const lockSet=v=>{try{localStorage.setItem(LOCK_KEY,JSON.stringify(v))}catch(e){}};
const hashSig=u=>String(u&&u.hash||'').slice(0,16);

/* ================= State ================= */
const S={
  phase:'boot', user:null, banks:[], open:[], users:[], audit:[], settings:{org:'TS Laundry'},
  online:true, loaded:{banks:false,open:false},
  route:'dash', sub:{}, ledgerRows:null, regRows:null, dlg:null,
  ui:{bank:'',q:'',sel:new Set(),drafts:{},bulkDate:today(),bulkRef:'',
      lBank:'',lFrom:monthStart(),lTo:today(),
      rFrom:monthStart(),rTo:today(),rKind:'',rBank:'',rStatus:'',rQ:'', aQ:'', showInactive:false}
};
const ROLES={ADMIN:'Administrator',ENCODER:'Encoder',VIEWER:'Viewer'};
const isAdmin=()=>S.user&&S.user.role==='ADMIN';
const canEdit=()=>S.user&&(S.user.role==='ADMIN'||S.user.role==='ENCODER');
const canSee=b=>isAdmin()||!S.user||!Array.isArray(S.user.banks)||S.user.banks.includes(b);
const bankById=id=>S.banks.find(b=>b.id===id);
const bankName=id=>{const b=bankById(id);return b?b.name:'(removed account)'};

/* ================= Balance engine =================
   Every entry has an "effect" on its bank account's running totals (in centavos):
   bal = cash in bank (opening + deposited collections + credits − released cheques − debits)
   unrel/unrel_n = unreleased cheques, undep/undep_n = collections not yet deposited.
   Saving an entry applies (new effect − old effect) to the bank document inside one Firestore
   transaction, so the dashboard totals always match the entries, for every user, in real time. */
function effect(t){
  if(!t||t.status==='void')return null;
  const a=t.amt||0;
  if(t.kind==='cheque')return t.status==='released'?{bank:t.bank,bal:-a}:{bank:t.bank,unrel:a,unrel_n:1};
  if(t.kind==='deposit')return t.status==='deposited'?{bank:t.bank,bal:a}:{bank:t.bank,undep:a,undep_n:1};
  if(t.kind==='debit')return{bank:t.bank,bal:-a};
  if(t.kind==='credit')return{bank:t.bank,bal:a};
  return null;
}
function addEff(acc,e,sign){if(!e)return;const d=acc[e.bank]||(acc[e.bank]={});for(const k of['bal','unrel','unrel_n','undep','undep_n'])if(e[k])d[k]=(d[k]||0)+sign*e[k]}
const bankSign=t=>(t.kind==='deposit'||t.kind==='credit')?t.amt:-t.amt;
function statusOf(kind,eff){return kind==='cheque'?(eff?'released':'unreleased'):kind==='deposit'?(eff?'deposited':'undeposited'):'posted'}

/* changes: [{id, next (full doc or null to delete), rev (expected revision, omit for new)}] */
async function commit(changes,audit){
  await Store.tx(async t=>{
    const prevs=[];
    for(const c of changes){
      const p=await t.get(C.txns+'/'+c.id);
      if(c.isNew&&p)throw new Error('Duplicate entry id, please try again.');
      if(!c.isNew){
        if(!p)throw new Error('This entry was deleted by someone else.');
        if(c.rev!=null&&(p.rev||0)!==c.rev)throw new Error('Someone else changed this entry a moment ago. Close it and open it again.');
      }
      prevs.push(p);
    }
    const delta={};
    changes.forEach((c,i)=>{addEff(delta,effect(prevs[i]),-1);addEff(delta,effect(c.next),1)});
    for(const b of Object.keys(delta)){if(!(await t.get(C.banks+'/'+b)))throw new Error('Bank account not found.')}
    changes.forEach((c,i)=>{const path=C.txns+'/'+c.id;if(c.next)t.set(path,{...noId(c.next),rev:((prevs[i]&&prevs[i].rev)||0)+1});else t.del(path)});
    for(const[b,d]of Object.entries(delta)){const u={};for(const[k,v]of Object.entries(d))if(v)u[k]=Store.inc(v);if(Object.keys(u).length)t.update(C.banks+'/'+b,u)}
    if(audit)t.set(C.audit+'/'+Store.newId(C.audit),{at:nowISO(),by:S.user.id,by_name:S.user.name,ref:changes[0]&&changes[0].id||'',...audit});
  });
}
function logAudit(action,summary,ref){if(!S.user)return;Store.set(C.audit+'/'+Store.newId(C.audit),{at:nowISO(),by:S.user.id,by_name:S.user.name,action,summary,ref:ref||''}).catch(()=>{})}

/* ================= Sign-in ================= */
async function adminExists(){const rows=await Store.query(C.users,[['role','==','ADMIN']]);return rows.some(u=>u.hash&&u.salt&&u.active!==false)}
async function signIn(username,pw){
  const lk=lockGet();
  if(lk.until&&lk.until>Date.now())throw new Error(`Too many attempts. Try again in ${Math.ceil((lk.until-Date.now())/60000)} minute(s).`);
  const id=userId(username);let u=null;
  if(id){try{u=await Store.getServer(C.users+'/'+id)}catch(e){if(String(e.code||'').includes('permission'))throw new Error(errMsg(e));try{u=await Store.get(C.users+'/'+id)}catch(e2){throw new Error(errMsg(e))}}}
  let ok=false;
  if(u&&u.hash&&u.salt)ok=ctEq(await pbkdf2(pw,u.salt,u.iter||ITER),u.hash);else await pbkdf2(pw,'AAAAAAAAAAAAAAAAAAAAAA==',20000);
  if(!ok||u.active===false){
    if(ok&&u.active===false)throw new Error('This user is deactivated. Ask the administrator.');
    const tries=(lk.tries||0)+1;
    if(tries>=MAX_TRIES){lockSet({tries:0,until:Date.now()+LOCK_MS});throw new Error('Too many attempts. Sign-in is paused for 5 minutes.')}
    lockSet({tries});throw new Error(`Incorrect username or password. ${MAX_TRIES-tries} attempt(s) left.`);
  }
  lockSet({});
  S.user={...u,id};sessSet(id,hashSig(u));
  Store.update(C.users+'/'+id,{last_login:nowISO()}).catch(()=>{});
  logAudit('SIGN_IN','Signed in',id);
  afterSignIn();
}
function afterSignIn(){if(S.user.must_change){S.phase='mustchange';render();return}S.phase='app';startData();route();}
async function resume(){
  const s=sessGet();if(!s)return false;
  try{const u=await Store.get(C.users+'/'+s.u);if(!u||u.active===false||hashSig(u)!==s.hs){sessClear();return false}S.user={...u,id:s.u};afterSignIn();return true}catch(e){return false}
}
function signOut(msg){
  if(S.user&&!msg)logAudit('SIGN_OUT','Signed out',S.user.id);
  stopData();sessClear();S.user=null;S.phase='login';closeDlg();render();if(msg)toast(msg);
}
let lastActive=Date.now();
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now();if(S.user)sessSet(S.user.id,hashSig(S.user))},{passive:true}));
setInterval(()=>{if(S.user&&Date.now()-lastActive>IDLE_MS)signOut('Signed out after 30 minutes of inactivity.')},30000);

async function markDone(kind,ids,date,dref){
  const cfg=openCfg(kind);
  if(!isISO(date))return toast('Enter a valid '+cfg.when.toLowerCase()+'.',true);
  const items=ids.map(id=>S.open.find(t=>t.id===id)).filter(Boolean);
  if(!items.length)return;
  for(const t of items){const b=bankById(t.bank);if(b&&b.open_date&&date<b.open_date)return toast(`${cfg.when} ${fd(date)} is before the opening date of ${b.name} (${fd(b.open_date)}).`,true)}
  if(date>today()&&!confirm(`${cfg.when} ${fd(date)} is in the future. Continue?`))return;
  const chunks=[];for(let i=0;i<items.length;i+=150)chunks.push(items.slice(i,i+150));
  try{
    for(const ch of chunks){
      await commit(ch.map(t=>({id:t.id,rev:t.rev||0,next:{...noId(t),eff:date,status:cfg.done,...(kind==='deposit'&&dref?{dref}:{}),...stamp()}})),
        {action:kind==='cheque'?'RELEASE':'DEPOSIT',summary:`${cfg.act==='Release'?'Released':'Deposited'} ${ch.length} item(s) totalling ${peso(ch.reduce((s,t)=>s+t.amt,0))} on ${fd(date)}`+(ch.length===1?` — ${ch[0].kind==='cheque'?'cheque #'+ch[0].no:''} ${ch[0].payee||''}`:'')});
    }
    ids.forEach(id=>{S.ui.sel.delete(id);delete S.ui.drafts[id]});
    toast(`${items.length} item(s) ${cfg.done}.`);
  }catch(e){toast(errMsg(e),true)}
}

function vLedger(){

  if(S.ledgerRows){
    const all=S.ledgerRows.filter(t=>t.bank===b.id&&t.status!=='void'&&t.eff&&t.eff>=from);
    const after=all.reduce((s,t)=>s+bankSign(t),0);

    start=(b.bal||0)-after-(openIn?(b.open_amt||0):0);
    list=all.filter(t=>t.eff<=to).sort((x,y)=>x.eff<y.eff?-1:x.eff>y.eff?1:String(x.created_at||'').localeCompare(String(y.created_at||'')));
    if(openIn&&b.open_date<=to)list.unshift({opening:true,eff:b.open_date,amt:b.open_amt||0});
    let run=start;
    const tr=list.map(t=>{const v=t.opening?t.amt:bankSign(t);run+=v;if(v>=0)sumIn+=v;else sumOut-=v;t._run=run;
      if(t.opening)return `<tr><td class="num">${fd(t.eff)}</td><td><span class="pill p-mute">Opening</span></td><td></td><td>Opening balance</td><td class="n pos">${v>=0?peso(v):''}</td><td class="n">${v<0?peso(-v):''}</td><td class="n b">${peso(run)}</td></tr>`;

      <td>${h(t.payee||'')}${t.note?`<div class="small muted">${h(t.note)}</div>`:''}</td><td class="n pos">${v>0?peso(v):''}</td><td class="n neg">${v<0?peso(-v):''}</td><td class="n b ${run<0?'neg':''}">${peso(run)}</td></tr>`}).join('');
    end=run;
    body=`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>No. / ref.</th><th>Payee / particulars</th><th class="n">Deposits &amp; credits</th><th class="n">Cheques &amp; debits</th><th class="n">Balance</th></tr></thead>
    <tbody><tr><td class="num">${fd(from)}</td><td></td><td></td><td class="b">Beginning balance</td><td></td><td></td><td class="n b">${peso(start)}</td></tr>${tr}</tbody>
    <tfoot><tr><td colspan="4">Ending balance ${fd(to)}</td><td class="n">${peso(sumIn)}</td><td class="n">${peso(sumOut)}</td><td class="n">${peso(end)}</td></tr></tfoot></table></div>
    ${S.ledgerRows.length>=10000?'<div class="note">Very long date range — choose a later "From" date for exact figures.</div>':''}`;
  }
  return `<div class="panel">
  <div class="row" style="margin-bottom:12px"><h1 style="margin:0">Bank ledger</h1><span class="spacer"></span>
    <select id="lBank" data-ui="lBank" aria-label="Bank account">${bankOptions(S.ui.lBank,{includeInactive:true})}</select>
    <label class="chk">From <input type="date" id="lFrom" data-ui="lFrom" value="${from}"></label>
    <label class="chk">To <input type="date" id="lTo" data-ui="lTo" value="${to}"></label>
    <button class="btn noprint" data-act="csvLedger">Export CSV</button><button class="btn noprint" data-act="print">Print</button></div>
  <p class="muted small" style="margin-top:0">${h(b.name)} · ${h([b.bank,b.acct_no].filter(Boolean).join(' · '))} — shows what has hit the bank: released cheques, deposited collections, bank debits and credits, by release / deposit date. Unreleased and undeposited items are not included until they are dated.</p>
  ${body}</div>`;
}
function typePill(t){
  if(t.status==='void')return '<span class="pill p-mute">Void</span>';
  if(t.xfer)return `<span class="pill p-info">Transfer ${t.kind==='debit'?'out':'in'}</span>`;
  const m={cheque:['Cheque','p-bad'],deposit:['Deposit','p-ok'],debit:['Debit','p-warn'],credit:['Credit','p-ok']}[t.kind]||[t.kind,'p-mute'];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}
function statusPill(t){
  switch(t.status){
    case 'unreleased':return '<span class="pill p-warn">Unreleased</span>';
    case 'released':return `<span class="pill p-ok">Released ${fd(t.eff)}</span>`;
    case 'undeposited':return '<span class="pill p-warn">Undeposited</span>';
    case 'deposited':return `<span class="pill p-ok">Deposited ${fd(t.eff)}</span>`;
    case 'void':return '<span class="pill p-mute">Void</span>';
    default:return '<span class="pill p-mute">Posted</span>';
  }
}

async function saveBank(f){
  const d=S.dlg,name=f.name.trim(),amt=parseAmt(f.open_amt||'0'),neg=/^\s*-/.test(f.open_amt);
  const open_amt=neg?-parseAmt(f.open_amt.replace('-','')):amt;
  if(!name)return toast('Enter the account name.',true);
  if(!Number.isFinite(open_amt))return toast('Enter a valid opening balance, e.g. 150000.00',true);
  if(!isISO(f.open_date))return toast('Enter the "as of" date.',true);
  const base={name,bank:f.bank.trim(),acct_no:f.acct_no.trim(),open_date:f.open_date,sort:parseInt(f.sort)||0,active:!!f.active,...stamp()};
  try{
    if(d.isNew){
      const id=Store.newId(C.banks);
      await Store.set(C.banks+'/'+id,{...base,open_amt,bal:open_amt,unrel:0,unrel_n:0,undep:0,undep_n:0,created_at:nowISO(),created_by:S.user.name});
      logAudit('BANK_ADD',`Added bank account ${name} (opening ${peso(open_amt)} as of ${fd(f.open_date)})`,id);
    }else{
      const id=d.bank.id;let old;
      await Store.tx(async t=>{old=await t.get(C.banks+'/'+id);if(!old)throw new Error('Bank account not found.');
        const delta=open_amt-(old.open_amt||0);t.update(C.banks+'/'+id,{...base,open_amt,...(delta?{bal:Store.inc(delta)}:{})})});
      const ch=[];if(old.open_amt!==open_amt)ch.push(`opening ${peso(old.open_amt)} → ${peso(open_amt)}`);if(old.open_date!==f.open_date)ch.push(`as of ${fd(old.open_date)} → ${fd(f.open_date)}`);if(old.name!==name)ch.push(`name ${old.name} → ${name}`);if((old.active!==false)!==!!f.active)ch.push(f.active?'activated':'deactivated');
      logAudit('BANK_EDIT',`Edited bank account ${name}${ch.length?': '+ch.join(', '):''}`,id);
    }
    closeDlg();toast('Bank account saved.');
  }catch(e){toast(errMsg(e),true)}
}
async function deleteBank(){
  const b=S.dlg.bank;
  try{
    const any=await Store.query(C.txns,[['bank','==',b.id]],{limit:1});
    if(any.length)return toast('This account has entries, so it cannot be deleted. Untick "Active" to hide it instead.',true);
    if(!confirm(`Delete bank account ${b.name}? This cannot be undone.`))return;
    await Store.del(C.banks+'/'+b.id);logAudit('BANK_DELETE',`Deleted bank account ${b.name}`,b.id);closeDlg();toast('Bank account deleted.');
  }catch(e){toast(errMsg(e),true)}
}
async function recalc(){
  try{
    toast('Checking all entries…');
    const all=await Store.query(C.txns,[]);
    const tot={};for(const b of S.banks)tot[b.id]={bal:b.open_amt||0,unrel:0,unrel_n:0,undep:0,undep_n:0};
    for(const t of all){const e=effect(t);if(e&&tot[e.bank])for(const k of['bal','unrel','unrel_n','undep','undep_n'])tot[e.bank][k]+=e[k]||0}
    const diffs=S.banks.filter(b=>['bal','unrel','unrel_n','undep','undep_n'].some(k=>(b[k]||0)!==tot[b.id][k]));
    if(!diffs.length)return toast(`All ${S.banks.length} account balances are correct (${all.length} entries checked).`);
    if(!confirm(`${diffs.length} account(s) have totals that do not match their entries:\n\n${diffs.map(b=>`${b.name}: shown ${peso(b.bal)}, entries give ${peso(tot[b.id].bal)}`).join('\n')}\n\nFix them now?`))return;
    for(const b of diffs)await Store.update(C.banks+'/'+b.id,tot[b.id]);
    logAudit('RECALC',`Fixed balances of ${diffs.map(b=>b.name).join(', ')}`);
    toast('Balances fixed.');
  }catch(e){toast(errMsg(e),true)}
}

      await Store.set(C.users+'/'+id,{username,name,role,banks,active:true,must_change:true,...hs,created_at:nowISO(),created_by:S.user.name,pw_set_at:nowISO(),pw_set_by:S.user.name});
      logAudit('USER_ADD',`Added user ${name} (${username}) as ${ROLES[role]}`,id);
      closeDlg();showPassword(name,username,f.pw);
    }else{
      const u=d.user,active=u.id===S.user.id?true:!!f.active;

}

async function setOwnPassword(pw,pw2,cur){

  try{
    const u=await Store.getServer(C.users+'/'+S.user.id);
    if(cur!=null&&!ctEq(await pbkdf2(cur,u.salt,u.iter||ITER),u.hash))return toast('Current password is incorrect.',true);

    S.user={...S.user,...hs,must_change:false};sessSet(S.user.id,hashSig(S.user));

async function saveEntry(f,again){
  const d=S.dlg,kind=d.kind,isNew=!d.id;
  const amt=parseAmt(f.amt);
  if(!f.bank)return toast('Choose the bank account.',true);
  if(!canSee(f.bank))return toast('You do not have access to that account.',true);
  if(!isISO(f.date))return toast('Enter the date.',true);
  if(!Number.isFinite(amt)||amt<=0)return toast('Enter a valid amount, e.g. 12500.00',true);
  const eff=(kind==='cheque'||kind==='deposit')?(f.eff||null):f.date;
  if(eff&&!isISO(eff))return toast('Check the release / deposit date.',true);
  const banksToCheck=[f.bank];if(kind==='transfer')banksToCheck.push(f.xbank);
  for(const bid of banksToCheck){const b=bankById(bid);if(!b)return toast('Choose the bank account.',true);
    const first=kind==='cheque'||kind==='deposit'?eff:f.date;
    if(first&&b.open_date&&first<b.open_date)return toast(`${fd(first)} is before the opening date of ${b.name} (${fd(b.open_date)}). Change the date or the account's opening date.`,true)}
  const base={date:f.date,amt,ref:(f.ref||'').trim(),note:(f.note||'').trim(),payee:(f.payee||'').trim(),...stamp()};
  const created=isNew?{created_at:nowISO(),created_by:S.user.name}:{created_at:d.t.created_at||'',created_by:d.t.created_by||''};
  try{
    if(kind==='transfer'){
      if(!f.xbank||f.xbank===f.bank)return toast('Choose two different accounts.',true);
      if(isNew){
        const xfer=Store.newId(C.txns),a=Store.newId(C.txns),b=Store.newId(C.txns);
        const common={...base,...created,eff:f.date,status:'posted',xfer};
        await commit([{id:a,isNew:true,next:{...common,kind:'debit',bank:f.bank,xbank:f.xbank,payee:'Transfer to '+bankName(f.xbank)}},
                      {id:b,isNew:true,next:{...common,kind:'credit',bank:f.xbank,xbank:f.bank,payee:'Transfer from '+bankName(f.bank)}}],
          {action:'ADD',summary:`Transfer ${peso(amt)} from ${bankName(f.bank)} to ${bankName(f.xbank)} on ${fd(f.date)}`});
      }else{
        const ch=d.legs.map(l=>{const isOut=l.kind==='debit',bank=isOut?f.bank:f.xbank,x=isOut?f.xbank:f.bank;
          return{id:l.id,rev:l.rev||0,next:{...noId(l),...base,eff:f.date,bank,xbank:x,payee:(isOut?'Transfer to ':'Transfer from ')+bankName(x)}}});
        await commit(ch,{action:'EDIT',summary:`Edited transfer ${peso(amt)} ${bankName(f.bank)} → ${bankName(f.xbank)} on ${fd(f.date)}`});
      }
    }else{
      if(kind==='cheque'){
        if(!(f.no||'').trim())return toast('Enter the cheque number.',true);
        if(!base.payee)return toast('Enter the payee.',true);
        const no=f.no.trim();
        const dup=(await Store.query(C.txns,[['no','==',no]])).filter(x=>x.bank===f.bank&&x.id!==d.id&&x.kind==='cheque');
        if(dup.length&&!confirm(`Cheque #${no} already exists for ${bankName(f.bank)} (${dup.map(x=>`${fd(x.date)} ${x.payee} ${peso(x.amt)}${x.status==='void'?' – void':''}`).join('; ')}). Save anyway?`))return;
        base.no=no;
      }
      if(kind==='deposit')base.dref=(f.dref||'').trim();
      const id=isNew?Store.newId(C.txns):d.id;
      const prev=isNew?{}:noId(d.t);
      const next={...prev,...base,...created,kind,bank:f.bank,eff,status:statusOf(kind,eff)};
      const label=kind==='cheque'?`cheque #${base.no} ${base.payee}`:`${KIND[kind].toLowerCase()} ${base.payee||base.ref||''}`;
      let sum=`${isNew?'Added':'Edited'} ${label} ${peso(amt)} (${bankName(f.bank)})`;
      if(!isNew){const o=d.t,c=[];if(o.amt!==amt)c.push(`amount ${peso(o.amt)} → ${peso(amt)}`);if(o.date!==f.date)c.push(`date ${fd(o.date)} → ${fd(f.date)}`);if((o.eff||null)!==eff)c.push(`${kind==='cheque'?'release':'deposit'} date ${o.eff?fd(o.eff):'none'} → ${eff?fd(eff):'none'}`);if(o.bank!==f.bank)c.push(`account ${bankName(o.bank)} → ${bankName(f.bank)}`);if(c.length)sum+=': '+c.join(', ')}
      await commit([{id,isNew,rev:isNew?undefined:d.rev,next}],{action:isNew?'ADD':'EDIT',summary:sum});
    }
    toast(isNew?'Entry saved.':'Changes saved.');
    if(again&&isNew){const keepBank=f.bank,keepDate=f.date;S.dlg={id:null,t:{bank:keepBank,date:keepDate},kind,rev:0};drawEntry();const el=$('#fEntry [name=no]')||$('#fEntry [name=amt]');el&&el.focus()}
    else closeDlg();
  }catch(e){toast(errMsg(e),true)}
}
async function voidEntry(unvoid){
  const d=S.dlg,t=d.t;let reason='';
  if(!unvoid){reason=prompt('Reason for voiding (e.g. spoiled cheque, wrong entry):','');if(reason===null)return}
  const items=d.legs||[t];
  const ch=items.map(x=>({id:x.id,rev:x.rev||0,next:unvoid?{...noId(x),status:statusOf(x.kind,x.eff),void_reason:null,voided_at:null,voided_by:null,...stamp()}
                                                          :{...noId(x),status:'void',void_reason:reason,voided_at:nowISO(),voided_by:S.user.name,...stamp()}}));
  if(unvoid)for(const x of items){if(x.kind==='cheque'||x.kind==='deposit')ch.find(c=>c.id===x.id).next.status=statusOf(x.kind,x.eff)}
  try{await commit(ch,{action:unvoid?'UNVOID':'VOID',summary:`${unvoid?'Restored':'Voided'} ${t.xfer?'transfer':(t.kind==='cheque'?'cheque #'+t.no:KIND[t.kind].toLowerCase())} ${t.payee||''} ${peso(t.amt)} (${bankName(t.bank)})${reason?' — '+reason:''}`});closeDlg();toast(unvoid?'Entry restored.':'Entry voided.')}
  catch(e){toast(errMsg(e),true)}
}
async function deleteEntry(){
  const d=S.dlg,t=d.t;
  if(!confirm('Delete this entry permanently? (Void keeps a record; delete removes it.)'))return;
  const items=d.legs||[t];
  try{await commit(items.map(x=>({id:x.id,rev:x.rev||0,next:null})),{action:'DELETE',summary:`Deleted ${t.xfer?'transfer':(t.kind==='cheque'?'cheque #'+t.no:KIND[t.kind].toLowerCase())} ${t.payee||''} ${peso(t.amt)} dated ${fd(t.date)} (${bankName(t.bank)})`});closeDlg();toast('Entry deleted.')}

/* ================= Dialog plumbing ================= */
function openDlg(html,state){if(state!==undefined)S.dlg=state;$('#dlg').innerHTML=html;$('#dlgwrap').classList.add('open');
  const first=$('#dlg input:not([type=hidden]):not([readonly]):not([disabled]),#dlg select:not([disabled])');setTimeout(()=>first&&first.focus(),30)}
function closeDlg(){$('#dlgwrap').classList.remove('open');$('#dlg').innerHTML='';S.dlg=null}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dlgwrap').classList.contains('open'))closeDlg()});

/* ================= Events ================= */
document.addEventListener('click',async e=>{
  const m=$('#umenu');if(m&&!m.contains(e.target))m.classList.remove('open');
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A'&&a!=='toLedger'&&a!=='toOpen')e.preventDefault();
  switch(a){
    case 'menu':m.classList.toggle('open');break;
    case 'signOut':signOut();break;
    case 'myPw':m&&m.classList.remove('open');dlgMyPw();break;
    case 'new':dlgEntry(null,S.route==='undep'?'deposit':'cheque');break;
    case 'edit':if(e.target.closest('input,button:not([data-act=edit])'))return;dlgEntry(id);break;
    case 'close':closeDlg();break;
    case 'kindPick':{const t=S.dlg.t||{};const form=$('#fEntry');if(form){const fdx=Object.fromEntries(new FormData(form));S.dlg.t={...t,bank:fdx.bank||t.bank,date:fdx.date||t.date,amt:parseAmt(fdx.amt)||t.amt,payee:fdx.payee,note:fdx.note,ref:fdx.ref}}S.dlg.kind=el.value;drawEntry();break}
    case 'toLedger':S.ui.lBank=id;break;
    case 'toOpen':S.ui.bank=id;break;
    case 'sel':el.checked?S.ui.sel.add(id):S.ui.sel.delete(id);render();break;
    case 'selAll':{const rows=openRows(S.route==='unrel'?'cheque':'deposit');if(el.checked)rows.forEach(r=>S.ui.sel.add(r.id));else S.ui.sel.clear();render();break}
    case 'oneDone':{const inp=document.getElementById('d_'+id);await markDone(el.dataset.kind,[id],inp?inp.value:today(),'');break}
    case 'bulkDone':await markDone(el.dataset.kind,[...S.ui.sel],S.ui.bulkDate,S.ui.bulkRef.trim());break;
    case 'void':voidEntry(false);break;
    case 'unvoid':voidEntry(true);break;
    case 'delEntry':deleteEntry();break;
    case 'bankNew':dlgBank(null);break;
    case 'bankEdit':dlgBank(bankById(id));break;
    case 'bankDel':deleteBank();break;
    case 'toggleInactive':S.ui.showInactive=el.checked;render();break;
    case 'recalc':recalc();break;
    case 'userNew':dlgUser(null);break;
    case 'userEdit':dlgUser(S.users.find(u=>u.id===id));break;
    case 'userReset':dlgReset(S.users.find(u=>u.id===id));break;
    case 'userDel':deleteUser(S.dlg.user.id,false);break;
    case 'userDelOld':deleteUser(id,true);break;
    case 'allBanksToggle':$('#bankList').style.display=el.checked?'none':'';break;
    case 'copyPw':try{await navigator.clipboard.writeText(el.dataset.pw);toast('Copied.')}catch(err){toast('Select the text and copy it.',true)}break;
    case 'print':window.print();break;
    case 'csvOpen':{const k=el.dataset.kind,cfg=openCfg(k);csvDownload(`${cfg.status}-${today()}.csv`,[[cfg.date,k==='cheque'?'Cheque no.':'OR/ref',`Account`,cfg.party,'Particulars','Amount','Age (days)'],...openRows(k).map(t=>[t.date,k==='cheque'?t.no:t.ref,bankName(t.bank),t.payee,t.note,plain(t.amt),daysBetween(t.date,today())])]);break}
    case 'csvReg':csvDownload(`entries-${S.ui.rFrom}-to-${S.ui.rTo}.csv`,[['Date','Type','Account','Other account','Cheque no.','Ref','Payee/source','Particulars','Amount','Status','Release/deposit date','Deposit slip','Created by','Last changed by'],...regFiltered().map(t=>[t.date,t.xfer?(t.kind==='debit'?'Transfer out':'Transfer in'):KIND[t.kind],bankName(t.bank),t.xbank?bankName(t.xbank):'',t.no||'',t.ref||'',t.payee||'',t.note||'',plain(t.amt),t.status,t.kind==='cheque'||t.kind==='deposit'?(t.eff||''):'',t.dref||'',t.created_by||'',t.updated_by||''])]);break;
    case 'csvLedger':{if(!S.ledgerRows)return;const b=bankById(S.ui.lBank);
      const all=S.ledgerRows.filter(t=>t.bank===b.id&&t.status!=='void'&&t.eff&&t.eff>=S.ui.lFrom);const openIn=b.open_date&&b.open_date>=S.ui.lFrom;
      let run=(b.bal||0)-all.reduce((s,t)=>s+bankSign(t),0)-(openIn?(b.open_amt||0):0);
      const list=all.filter(t=>t.eff<=S.ui.lTo).sort((x,y)=>x.eff<y.eff?-1:x.eff>y.eff?1:String(x.created_at||'').localeCompare(String(y.created_at||'')));
      const out=[['Date','Type','No./ref','Payee','Particulars','Deposits & credits','Cheques & debits','Balance'],[S.ui.lFrom,'','','Beginning balance','','','',plain(run)]];
      if(openIn&&b.open_date<=S.ui.lTo){run+=b.open_amt||0;out.push([b.open_date,'Opening','','Opening balance','',plain(b.open_amt),'',plain(run)])}
      for(const t of list){const v=bankSign(t);run+=v;out.push([t.eff,t.xfer?'Transfer':KIND[t.kind],t.kind==='cheque'?t.no:(t.ref||t.dref||''),t.payee||'',t.note||'',v>0?plain(v):'',v<0?plain(-v):'',plain(run)])}
      csvDownload(`ledger-${b.name.replace(/[^\w-]+/g,'_')}-${S.ui.lFrom}-to-${S.ui.lTo}.csv`,out);break}
    case 'csvAudit':csvDownload(`activity-${today()}.csv`,[['When','User','Action','Details'],...S.audit.map(a=>[a.at,a.by_name,a.action,a.summary])]);break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.draft){S.ui.drafts[el.dataset.draft]=el.value;return}
  if(el.dataset.ui&&(el.type==='search'||el.type==='text')){S.ui[el.dataset.ui]=el.value;if(el.dataset.ui!=='bulkRef')schedule()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.ui&&el.type!=='search'&&el.type!=='text'){
    const k=el.dataset.ui;
    if(el.type==='date'&&!isISO(el.value)){el.value=S.ui[k];return}
    S.ui[k]=el.value;
    if(k==='lFrom'&&S.ui.lTo<S.ui.lFrom)S.ui.lTo=S.ui.lFrom;
    if(k==='rFrom'&&S.ui.rTo<S.ui.rFrom)S.ui.rTo=S.ui.rFrom;
    if(k==='rTo'&&S.ui.rTo<S.ui.rFrom)S.ui.rFrom=S.ui.rTo;
    if(k==='bank')S.ui.sel=new Set();
    if(k!=='bulkDate')render();
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.target,f=Object.fromEntries(new FormData(form));
  const btns=form.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  try{
    switch(form.id){
      case 'fLogin':S.loginNote='';S.loginUser=f.username;try{await signIn(f.username,f.pw)}catch(err){S.loginNote=err.message;render()}break;
      case 'fSetup':{
        if(f.pw.length<8){toast('Use at least 8 characters.',true);break}
        if(f.pw!==f.pw2){toast('The two passwords do not match.',true);break}
        try{
          if(await adminExists()){S.phase='login';render();toast('An administrator already exists. Please sign in.');break}
          const id=userId(f.username);if(!id){toast('Enter a username.',true);break}
          const hs=await makeHash(f.pw);
          await Store.set(C.users+'/'+id,{username:f.username.trim(),name:f.name.trim()||'Administrator',role:'ADMIN',banks:null,active:true,must_change:false,...hs,created_at:nowISO(),created_by:'setup',pw_set_at:nowISO(),pw_set_by:'setup'});
          await Store.set(C.settings+'/main',{org:'TS Laundry'}).catch(()=>{});
          S.phase='login';render();await signIn(f.username,f.pw);
        }catch(err){toast(errMsg(err),true)}
        break}
      case 'fMust':await setOwnPassword(f.pw,f.pw2,null);break;
      case 'fMyPw':await setOwnPassword(f.pw,f.pw2,f.cur);break;
      case 'fEntry':await saveEntry(f,e.submitter&&e.submitter.name==='again');break;
      case 'fBankAcct':await saveBank(f);break;
      case 'fUser':await saveUser(f);break;
      case 'fReset':await saveReset(f);break;
      case 'fOrg':try{await Store.set(C.settings+'/main',{...S.settings,org:(f.org||'').trim()});logAudit('SETTINGS',`Company name set to ${(f.org||'').trim()}`);toast('Saved.')}catch(err){toast(errMsg(err),true)}break;
    }
  }finally{btns.forEach(b=>{if(document.contains(b))b.disabled=false})}
});

/* ================= Start ================= */
(async function boot(){
  try{Store=DEMO?makeLocal():makeRemote()}catch(e){$('#app').innerHTML=`<div class="login"><div class="panel"><h1>Cannot start</h1><p>${h(errMsg(e))}</p><p class="muted">Check the internet connection and reload.</p></div></div>`;return}
  if(await resume())return;
  S.phase='login';
  try{if(!(await adminExists()))S.phase='setup'}catch(e){S.loginNote=errMsg(e)}
  render();
})();
</script>
</body>
</html>
