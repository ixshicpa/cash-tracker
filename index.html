<script>
'use strict';
/* ================= Firebase connection (project: database-55b53) =================
   This tracker keeps its own data in the cash_* collections only:
   cash_users, cash_banks, cash_txns, cash_audit, cash_settings. It never reads or changes the payroll data. */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {
  apiKey:"AIzaSyBfrdsMbfhQn4uF8HbZSkCx2kOLnNClfwY",
  authDomain:"database-55b53.firebaseapp.com",
  projectId:"database-55b53",
  storageBucket:"database-55b53.firebasestorage.app",
  messagingSenderId:"706968150921",
  appId:"1:706968150921:web:e25fb80011714f889cb758"
};
/* App Check (reCAPTCHA v3): proves requests come from this website. Paste the reCAPTCHA v3 SITE key here.
   Leave it empty to run without App Check. */
const APPCHECK_SITE_KEY = '';
const DEMO = /[?&]demo\b/.test(location.search);
const C = {users:'cash_users', banks:'cash_banks', txns:'cash_txns', audit:'cash_audit', settings:'cash_settings'};

/* ================= Small helpers ================= */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const monthStart = () => today().slice(0,8)+'01';
const addDays = (iso,n) => {const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd = iso => iso ? `${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}, ${iso.slice(0,4)}` : '';
const fdt = iso => {if(!iso)return '';const d=new Date(iso);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}`};
const money = c => (Math.abs(c||0)/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const peso = c => ((c||0)<0?'−':'')+'₱'+money(c);
const plain = c => ((c||0)/100).toFixed(2);
function parseAmt(s){const t=String(s??'').replace(/[₱,\s]/g,'');if(!/^\d+(\.\d{0,2})?$/.test(t)&&!/^\.\d{1,2}$/.test(t))return NaN;return Math.round(parseFloat(t)*100)}
const nowISO = () => new Date().toISOString();
const clone = o => o==null?o:JSON.parse(JSON.stringify(o));
const noId = o => {const c={...o};delete c.id;for(const k of Object.keys(c))if(c[k]===undefined)delete c[k];return c};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(msg,err){const t=document.createElement('div');t.className='t'+(err?' err':'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),err?6000:3200)}
function errMsg(e){
  const c=String(e&&e.code||'');
  if(c.includes('permission'))return 'Not allowed: your role cannot do this, or your session ended. Sign in again. If it keeps happening, check the cash_* Firestore rules.';
  if(c.includes('unavailable')||c.includes('failed-precondition')&&/offline/i.test(e.message||''))return 'No connection to the database. Check the internet and try again.';
  return (e&&e.message)||String(e);
}
function csvDownload(name,rows){
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const blob=new Blob(['﻿'+rows.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ================= Data store: Firestore (live) or this-browser demo ================= */
function makeRemote(){
  firebase.initializeApp(FIREBASE_CONFIG);
  if(APPCHECK_SITE_KEY){
    try{firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(APPCHECK_SITE_KEY),true)}
    catch(e){console.error('App Check could not start',e)}
  }
  const db=firebase.firestore();
  /* No offline cache: nothing stays in the browser after signing out (safer on shared PCs). */
  const q=(col,where=[],o={})=>{let r=db.collection(col);for(const w of where)r=r.where(w[0],w[1],w[2]);if(o.orderBy)r=r.orderBy(o.orderBy[0],o.orderBy[1]||'asc');if(o.limit)r=r.limit(o.limit);return r};
  const wrap=s=>s.exists?{...s.data(),id:s.id}:null;
  return {
    listen(col,where,cb,onErr,o={}){return q(col,where,o).onSnapshot({includeMetadataChanges:!!o.meta},s=>cb(s.docs.map(d=>({...d.data(),id:d.id})),s.metadata),e=>onErr&&onErr(e))},
    listenDoc(path,cb,onErr){return db.doc(path).onSnapshot(s=>cb(wrap(s)),e=>onErr&&onErr(e))},
    async get(path){return wrap(await db.doc(path).get())},
    async getServer(path){return wrap(await db.doc(path).get({source:'server'}))},
    async query(col,where,o){const s=await q(col,where,o).get();return s.docs.map(d=>({...d.data(),id:d.id}))},
    set(path,d){return db.doc(path).set(d)},
    update(path,d){return db.doc(path).update(d)},
    del(path){return db.doc(path).delete()},
    newId(col){return db.collection(col).doc().id},
    inc(n){return firebase.firestore.FieldValue.increment(n)},
    addToList(path,...v){return db.doc(path).set({names:firebase.firestore.FieldValue.arrayUnion(...v)},{merge:true})},
    removeFromList(path,v){return db.doc(path).set({names:firebase.firestore.FieldValue.arrayRemove(v)},{merge:true})},
    tx(fn){return db.runTransaction(T=>fn({
      async get(p){return wrap(await T.get(db.doc(p)))},
      set(p,d){T.set(db.doc(p),d)}, update(p,d){T.update(db.doc(p),d)}, del(p){T.delete(db.doc(p))}
    }))}
  };
}
function makeLocal(){
  const KEY='cash-tracker-demo-v1';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const cmp=(a,op,b)=>op==='=='?a===b:op==='in'?b.includes(a):(a===null||typeof a!==typeof b)?false:op==='>='?a>=b:op==='<='?a<=b:op==='>'?a>b:op==='<'?a<b:true;
  const one=p=>data[p]?{...clone(data[p]),id:p.split('/').pop()}:null;
  const rows=(col,where=[],o={})=>{let out=[];for(const[p,v]of Object.entries(data)){const i=p.lastIndexOf('/');if(p.slice(0,i)!==col)continue;
      if(where.every(w=>v[w[0]]!==undefined&&cmp(v[w[0]],w[1],w[2])))out.push({...clone(v),id:p.slice(i+1)})}
    if(o.orderBy){const[f,dir]=o.orderBy;out.sort((a,b)=>(a[f]<b[f]?-1:a[f]>b[f]?1:0)*(dir==='desc'?-1:1))}
    return o.limit?out.slice(0,o.limit):out};
  const upd=(p,d)=>{if(!data[p])throw Object.assign(new Error('No document to update: '+p),{code:'not-found'});
    for(const[k,v]of Object.entries(d)){if(v&&typeof v==='object'&&'__inc'in v)data[p][k]=(data[p][k]||0)+v.__inc;else data[p][k]=clone(v)}};
  return {
    listen(col,where,cb,_e,o={}){const run=()=>cb(rows(col,where,o),{fromCache:false});subs.add(run);setTimeout(run,0);return()=>subs.delete(run)},
    listenDoc(path,cb){const run=()=>cb(one(path));subs.add(run);setTimeout(run,0);return()=>subs.delete(run)},
    async get(p){return one(p)}, async getServer(p){return one(p)},
    async query(col,where,o){return rows(col,where,o)},
    async set(p,d){data[p]=clone(d);save();notify()},
    async update(p,d){upd(p,d);save();notify()},
    async del(p){delete data[p];save();notify()},
    newId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)},
    inc(n){return{__inc:n}},
    async addToList(p,...v){const d=data[p]||(data[p]={names:[]});d.names=d.names||[];for(const x of v)if(!d.names.includes(x))d.names.push(x);save();notify()},
    async removeFromList(p,v){if(data[p]&&data[p].names){data[p].names=data[p].names.filter(x=>x!==v);save();notify()}},
    async tx(fn){const backup=clone(data),ops=[];
      try{const r=await fn({get:async p=>one(p),set:(p,d)=>ops.push(['s',p,d]),update:(p,d)=>ops.push(['u',p,d]),del:p=>ops.push(['d',p])});
        for(const[t,p,d]of ops){if(t==='s')data[p]=clone(d);else if(t==='u')upd(p,d);else delete data[p]}
        save();notify();return r}catch(e){data=backup;throw e}}
  };
}
let Store;

/* ================= Sign-in: Firebase Authentication (email + password) =================
   Firebase checks the password. The Firestore rules then check the user's profile in cash_users/{uid}
   (role, active, bank accounts), so the data cannot be read or changed without signing in,
   even by someone who bypasses this page. */
let Auth;
const IDLE_MS=30*60*1000;
function tempPassword(){const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(10));return Array.from(r,x=>A[x%A.length]).join('')}
const isEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());
function authMsg(e){const c=String(e&&e.code||'');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Incorrect email or password.';
  if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes, or use "Forgot password".';
  if(c.includes('user-disabled'))return 'This login is disabled in Firebase Authentication.';
  if(c.includes('email-already-in-use'))return 'That email already has a login.';
  if(c.includes('invalid-email'))return 'Enter a valid email address.';
  if(c.includes('weak-password'))return 'Use a stronger password (at least 8 characters).';
  if(c.includes('network'))return 'No internet connection.';
  if(c.includes('operation-not-allowed'))return 'Email/password sign-in is turned off. Turn it on in Firebase → Authentication → Sign-in method.';
  if(c.includes('requires-recent-login'))return 'For security, sign out and sign in again, then retry.';
  return errMsg(e)}
function makeRemoteAuth(){
  const auth=firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  let sec=null;
  const secondary=()=>{if(!sec){sec=firebase.initializeApp(FIREBASE_CONFIG,'userCreate').auth();sec.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(()=>{})}return sec};
  return {
    onChange(cb){return auth.onAuthStateChanged(u=>cb(u?{uid:u.uid,email:u.email}:null))},
    async signIn(email,pw){const r=await auth.signInWithEmailAndPassword(email,pw);return{uid:r.user.uid,email:r.user.email}},
    async create(email,pw){const r=await auth.createUserWithEmailAndPassword(email,pw);return{uid:r.user.uid,email:r.user.email}},
    /* creates another person's login without signing the administrator out */
    async createOther(email,pw){const a=secondary();const r=await a.createUserWithEmailAndPassword(email,pw);const uid=r.user.uid;await a.signOut();return uid},
    signOut(){return auth.signOut()},
    async setPassword(pw){await auth.currentUser.updatePassword(pw)},
    async changePassword(cur,pw){const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(pw)},
    sendReset(email){return auth.sendPasswordResetEmail(email)}
  };
}
function makeLocalAuth(){ /* demo mode only — stands in for Firebase Authentication inside this browser */
  const KEY='cash-tracker-demo-auth';let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
  let cur=null;try{cur=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(e){}
  const subs=new Set(),err=c=>Object.assign(new Error(c),{code:'auth/'+c}),norm=e=>String(e||'').trim().toLowerCase();
  const setCur=u=>{cur=u;try{sessionStorage.setItem(KEY,JSON.stringify(u))}catch(e){}subs.forEach(f=>f(cur))};
  const mk=(e,pw)=>{if(db[e])throw err('email-already-in-use');if(String(pw).length<6)throw err('weak-password');db[e]={uid:'u'+Math.random().toString(36).slice(2,12),pw};save();return db[e].uid};
  return {
    onChange(cb){subs.add(cb);setTimeout(()=>cb(cur),0);return()=>subs.delete(cb)},
    async signIn(email,pw){const a=db[norm(email)];if(!a||a.pw!==pw)throw err('invalid-credential');setCur({uid:a.uid,email:norm(email)});return cur},
    async create(email,pw){const e=norm(email),uid=mk(e,pw);setCur({uid,email:e});return cur},
    async createOther(email,pw){return mk(norm(email),pw)},
    async signOut(){setCur(null)},
    async setPassword(pw){db[cur.email].pw=pw;save()},
    async changePassword(c,pw){if(db[cur.email].pw!==c)throw err('invalid-credential');db[cur.email].pw=pw;save()},
    async sendReset(email){console.log('[demo] password reset email to',email)}
  };
}

/* ================= Balance engine =================
   Every entry has an "effect" on its bank account's running totals (in centavos):
   bal = cash in bank (opening + deposited collections + credits − released cheques − debits)
   unrel/unrel_n = unreleased cheques, undep/undep_n = collections not yet deposited.
   Saving an entry applies (new effect − old effect) to the bank document inside one Firestore
   transaction, so the dashboard totals always match the entries, for every user, in real time. */
/* Bank statement date: bd = the date the entry reflected in the bank (bdate, or the release / deposit /
   entry date when no bank date was entered). null while unreleased, undeposited, "not yet in bank" or void.
   bbal on the bank account = opening balance + everything that has reached the bank (by bd). */
const bdOf=t=>(!t||t.status==='void'||!t.eff||t.bpend)?null:(t.bdate||t.eff);
const KEYS=['bal','unrel','unrel_n','undep','undep_n','bbal'];
function effect(t){
  if(!t||t.status==='void')return null;
  const a=t.amt||0,bb=t.bd?bankSign(t):0;let e=null;
  if(t.kind==='cheque')e=t.status==='released'?{bal:-a}:{unrel:a,unrel_n:1};
  else if(t.kind==='deposit')e=t.status==='deposited'?{bal:a}:{undep:a,undep_n:1};
  else if(t.kind==='debit')e={bal:-a};
  else if(t.kind==='credit')e={bal:a};
  if(!e)return null;
  e.bank=t.bank;if(bb)e.bbal=bb;return e;
}
function addEff(acc,e,sign){if(!e)return;const d=acc[e.bank]||(acc[e.bank]={});for(const k of KEYS)if(e[k])d[k]=(d[k]||0)+sign*e[k]}
function bankSign(t){return (t.kind==='deposit'||t.kind==='credit')?t.amt:-t.amt}
function statusOf(kind,eff){return kind==='cheque'?(eff?'released':'unreleased'):kind==='deposit'?(eff?'deposited':'undeposited'):'posted'}

/* changes: [{id, next (full doc or null to delete), rev (expected revision, omit for new)}] */
async function commit(changes,audit){
  await Store.tx(async t=>{
    const prevs=[];
    for(const c of changes){
      const p=await t.get(C.txns+'/'+c.id);
      if(c.isNew&&p)throw new Error('Duplicate entry id, please try again.');
      if(!c.isNew){
        if(!p)throw new Error('This entry was deleted by someone else.');
        if(c.rev!=null&&(p.rev||0)!==c.rev)throw new Error('Someone else changed this entry a moment ago. Close it and open it again.');
      }
      prevs.push(p);
    }
    for(const c of changes)if(c.next){c.next={...c.next};if(c.next.bdate&&c.next.bdate===c.next.eff)c.next.bdate=null;c.next.bd=bdOf(c.next)}
    const delta={};
    changes.forEach((c,i)=>{addEff(delta,effect(prevs[i]),-1);addEff(delta,effect(c.next),1)});
    for(const b of Object.keys(delta)){if(!(await t.get(C.banks+'/'+b)))throw new Error('Bank account not found.')}
    changes.forEach((c,i)=>{const path=C.txns+'/'+c.id;if(c.next)t.set(path,{...noId(c.next),rev:((prevs[i]&&prevs[i].rev)||0)+1});else t.del(path)});
    for(const[b,d]of Object.entries(delta)){const u={};for(const[k,v]of Object.entries(d))if(v)u[k]=Store.inc(v);if(Object.keys(u).length)t.update(C.banks+'/'+b,u)}
    if(audit)t.set(C.audit+'/'+Store.newId(C.audit),{at:nowISO(),by:S.user.id,by_name:S.user.name,ref:changes[0]&&changes[0].id||'',...audit});
  });
}
function logAudit(action,summary,ref){if(!S.user)return Promise.resolve();return Store.set(C.audit+'/'+Store.newId(C.audit),{at:nowISO(),by:S.user.id,by_name:S.user.name,action,summary,ref:ref||''}).catch(()=>{})}

async function setupNeeded(){try{return !(await Store.get(C.settings+'/admin_lock'))}catch(e){return false}}
async function loadProfile(au){
  const p=await Store.get(C.users+'/'+au.uid);
  if(!p||!p.role||p.hash||p.active===false){
    await Auth.signOut();
    throw new Error(!p||!p.role||p.hash?'This login has no access to the Cash Tracker yet. Ask the administrator to add you in Users.':'Your access is deactivated. Ask the administrator.');
  }
  return {...p,id:au.uid,email:au.email||p.email};
}
async function showLogin(){S.phase=(await setupNeeded())?'setup':'login';render()}
function onAuth(au){
  if(S.settingUp)return;
  if(!au){if(S.user){stopData();S.user=null;closeDlg()}showLogin();return}
  if(S.user&&S.user.id===au.uid)return;
  loadProfile(au).then(p=>{
    S.user=p;S.loginNote='';
    Store.update(C.users+'/'+p.id,{last_login:nowISO()}).catch(()=>{});
    if(S.justSignedIn){logAudit('SIGN_IN','Signed in',p.id);S.justSignedIn=false}
    afterSignIn();
  }).catch(e=>{S.loginNote=errMsg(e);showLogin()});
}
async function signIn(email,pw){
  S.justSignedIn=true;
  try{await Auth.signIn(email.trim(),pw)}catch(e){S.justSignedIn=false;throw new Error(authMsg(e))}
}
function afterSignIn(){if(S.user.must_change){S.phase='mustchange';render();return}S.phase='app';startData();route();}
async function signOut(msg){
  if(S.user&&!msg)await Promise.race([logAudit('SIGN_OUT','Signed out',S.user.id),sleep(1500)]);
  stopData();S.user=null;closeDlg();
  await Auth.signOut().catch(()=>{});
  if(msg){S.loginNote='';toast(msg)}
}
async function forgotPassword(email){
  email=String(email||'').trim();
  if(!isEmail(email))return toast('Type your email address first, then click "Forgot password".',true);
  try{await Auth.sendReset(email)}catch(e){if(String(e.code||'').includes('invalid-email'))return toast(authMsg(e),true)}
  toast('If that email has a login, a link to reset the password was sent. Check the inbox and spam folder.');
}

const NAV=[['dash','Dashboard'],['unrel','Unreleased cheques'],['undep','Undeposited'],['ledger','Bank ledger'],['statement','Bank statement'],['register','All entries'],['banks','Bank accounts',1],['users','Users',1],['activity','Activity']];
/* Tabs an administrator can give to other users. Bank accounts and Users stay administrator-only.
   user.tabs = null → default set (all of these except Activity); array → exactly those tabs. */
const USER_TABS=[['dash','Dashboard'],['unrel','Unreleased cheques'],['undep','Undeposited'],['ledger','Bank ledger'],['statement','Bank statement'],['register','All entries'],['activity','Activity']];
const DEFAULT_TABS=['dash','unrel','undep','ledger','statement','register'];
const tabsOf=u=>u&&u.role==='ADMIN'?NAV.map(n=>n[0]):(Array.isArray(u&&u.tabs)?u.tabs:DEFAULT_TABS);
const canTab=k=>!!S.user&&(isAdmin()||(!(NAV.find(n=>n[0]===k)||[])[2]&&tabsOf(S.user).includes(k)));
/* Which entry types a user may add/edit: follows the tabs they were given. */
function kindAllowed(k){if(!canEdit())return false;if(isAdmin())return true;
  if(k==='cheque')return canTab('unrel')||canTab('register');
  if(k==='deposit')return canTab('undep')||canTab('register');
  return canTab('ledger')||canTab('register')}
function route(){const r=(location.hash||'').slice(1);const ok=NAV.filter(n=>canTab(n[0])).map(n=>n[0]);S.route=ok.includes(r)?r:(ok[0]||'none');S.ui.sel=new Set();render()}

function render(){

  const ae=document.activeElement,fid=ae&&ae.id&&app.contains(ae)?ae.id:null;let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}

  const T={bal:0,unrel:0,unrel_n:0,undep:0,undep_n:0};for(const b of banks)for(const k in T)T[k]+=b[k]||0;
  const proj=T.bal-T.unrel+T.undep;
  const openU=S.open.filter(t=>t.status==='unreleased'&&canSee(t.bank)).sort((a,b)=>a.date<b.date?-1:1).slice(0,6);
  const openD=S.open.filter(t=>t.status==='undeposited'&&canSee(t.bank)).sort((a,b)=>a.date<b.date?-1:1).slice(0,6);
  const mini=(rows,party)=>rows.length?`<table><tbody>${rows.map(t=>`<tr class="click" data-act="edit" data-id="${t.id}"><td class="small">${fd(t.date)}<br><span class="muted">${h(bankName(t.bank))}</span></td><td>${h(t.kind==='cheque'?('#'+(t.no||'')+' · '):'')}${h(t.payee||t.note||'')}</td><td class="n">${peso(t.amt)}<br><span class="small muted">${daysBetween(t.date,today())} days</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty small">Nothing pending.</div>';

/* ---------- Unreleased cheques / Undeposited collections ---------- */
function openCfg(kind){return kind==='cheque'
  ?{status:'unreleased',title:'Unreleased cheques',date:'Cheque date',party:'Payee',when:'Release date',act:'Release',done:'released'}
  :{status:'undeposited',title:'Undeposited collections',date:'Date received',party:'Customer',when:'Deposit date',act:'Deposit',done:'deposited'}}
const payOf=t=>t.pay==='cheque'?'cheque':'cash';
const payLabel=t=>t.kind!=='deposit'?'':payOf(t)==='cheque'?`Cheque${t.chk_no?' #'+t.chk_no:''}${t.chk_bank?' · '+t.chk_bank:''}${t.chk_date?' · '+fd(t.chk_date):''}`:'Cash';
const payPill=t=>payOf(t)==='cheque'?`<span class="pill p-info">Cheque</span><div class="small muted">${h([t.chk_no?'#'+t.chk_no:'',t.chk_bank,t.chk_date?fd(t.chk_date):''].filter(Boolean).join(' · '))}</div>`:'<span class="pill p-mute">Cash</span>';
function openRows(kind){
  const cfg=openCfg(kind),q=S.ui.q.trim().toLowerCase();
  return S.open.filter(t=>t.status===cfg.status&&canSee(t.bank)&&(!S.ui.bank||t.bank===S.ui.bank)&&
    (kind!=='deposit'||!S.ui.pay||payOf(t)===S.ui.pay)&&
    (!q||[t.no,t.payee,t.ref,t.note,t.chk_no,t.chk_bank,peso(t.amt),money(t.amt)].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.no||'').localeCompare(String(b.no||''),undefined,{numeric:true}));
}
function vOpen(kind){
  const cfg=openCfg(kind),rows=openRows(kind),ed=kindAllowed(kind);
  for(const id of [...S.ui.sel])if(!rows.some(r=>r.id===id))S.ui.sel.delete(id);
  const sel=rows.filter(r=>S.ui.sel.has(r.id)),selTot=sel.reduce((s,r)=>s+r.amt,0),tot=rows.reduce((s,r)=>s+r.amt,0);
  return `<div class="panel">
  <div class="row" style="margin-bottom:12px"><h1 style="margin:0">${cfg.title}</h1><span class="spacer"></span>
    <select id="fBank" data-ui="bank" aria-label="Bank account">${bankOptions(S.ui.bank,{blank:'All accounts'})}</select>
    ${kind==='deposit'?`<select id="fPay" data-ui="pay" aria-label="Collected as"><option value="">Cash and cheques</option><option value="cash" ${S.ui.pay==='cash'?'selected':''}>Cash only</option><option value="cheque" ${S.ui.pay==='cheque'?'selected':''}>Cheques only</option></select>`:''}
    <input type="search" id="fQ" data-ui="q" placeholder="Search no., name, amount" value="${h(S.ui.q)}">
    <button class="btn noprint" data-act="csvOpen" data-kind="${kind}">Export CSV</button></div>
  <p class="muted small" style="margin-top:0">${kind==='cheque'
    ?'Cheques that were written but not yet handed to the payee. Enter the release date when the cheque is released — it then leaves this list and is deducted from cash in bank.'
    :'Collections received but not yet deposited. Enter the deposit date when it is deposited — it then leaves this list and is added to cash in bank.'+(rows.length?` <b>Cash: ${peso(rows.filter(t=>payOf(t)==='cash').reduce((s,t)=>s+t.amt,0))} · Cheques: ${peso(rows.filter(t=>payOf(t)==='cheque').reduce((s,t)=>s+t.amt,0))}</b>`:'')}</p>
  ${ed&&rows.length?`<div class="bulk"><b style="align-self:center">${sel.length?`${sel.length} selected · ${peso(selTot)}`:'Tick rows to '+cfg.act.toLowerCase()+' several at once'}</b><span class="spacer"></span>
    <label class="f">${cfg.when}<input type="date" id="bulkDate" data-ui="bulkDate" value="${h(S.ui.bulkDate)}"></label>
    ${kind==='deposit'?`<label class="f">Deposit slip no. (optional)<input type="text" id="bulkRef" data-ui="bulkRef" value="${h(S.ui.bulkRef)}" style="width:150px"></label>`:''}
    <button class="btn primary" data-act="bulkDone" data-kind="${kind}" ${sel.length?'':'disabled'}>${cfg.act} selected</button></div>`:''}
  ${rows.length?`<div class="tablewrap"><table><thead><tr>
    ${ed?`<th><input type="checkbox" data-act="selAll" aria-label="Select all" ${sel.length&&sel.length===rows.length?'checked':''}></th>`:''}
    <th>${cfg.date}</th>${kind==='cheque'?'<th>Cheque no.</th><th>APV / ref.</th>':'<th>OR / ref.</th>'}<th>Account</th>${kind==='deposit'?'<th>Collected as</th>':''}<th>${cfg.party}</th><th>Particulars</th><th class="n">Amount</th><th class="n">Age</th>
    ${ed?`<th>${cfg.when}</th><th></th>`:''}</tr></thead><tbody>
    ${rows.map(t=>{const age=daysBetween(t.date,today());const stale=kind==='cheque'&&age>180;
      return `<tr class="${S.ui.sel.has(t.id)?'sel':''}">
      ${ed?`<td><input type="checkbox" data-act="sel" data-id="${t.id}" ${S.ui.sel.has(t.id)?'checked':''} aria-label="Select"></td>`:''}
      <td class="num">${fd(t.date)}</td><td class="num"><a href="#" data-act="edit" data-id="${t.id}">${h(kind==='cheque'?t.no:(t.ref||'—'))}</a></td>${kind==='cheque'?`<td class="num">${h(t.ref||'')}</td>`:''}
      <td>${h(bankName(t.bank))}</td>${kind==='deposit'?`<td>${payPill(t)}</td>`:''}<td>${h(t.payee)}</td><td class="small">${h(t.note)}</td><td class="n b">${peso(t.amt)}</td>
      <td class="n">${age<0?'<span class="pill p-info">post-dated</span>':stale?`<span class="pill p-bad">${age} d · stale</span>`:age>30?`<span class="pill p-warn">${age} d</span>`:age+' d'}</td>
      ${ed?`<td><input type="date" id="d_${t.id}" data-draft="${t.id}" value="${h(S.ui.drafts[t.id]||today())}" aria-label="${cfg.when}"></td>
      <td><button class="btn sm primary" data-act="oneDone" data-id="${t.id}" data-kind="${kind}">${cfg.act}</button></td>`:''}</tr>`}).join('')}
    </tbody><tfoot><tr>${ed?'<td></td>':''}<td colspan="6">${rows.length} item(s)</td><td class="n">${peso(tot)}</td><td></td>${ed?'<td></td><td></td>':''}</tr></tfoot></table></div>`
  :`<div class="empty">${S.loaded.open?'Nothing pending.':'Loading…'}</div>`}
  </div>`;
}
async function markDone(kind,ids,date,dref){
  const cfg=openCfg(kind);
  if(!isISO(date))return toast('Enter a valid '+cfg.when.toLowerCase()+'.',true);
  const items=ids.map(id=>S.open.find(t=>t.id===id)).filter(Boolean);
  if(!items.length)return;
  for(const t of items){const b=bankById(t.bank);if(b&&b.open_date&&date<b.open_date)return toast(`${cfg.when} ${fd(date)} is before the opening date of ${b.name} (${fd(b.open_date)}).`,true)}
  if(date>today()&&!confirm(`${cfg.when} ${fd(date)} is in the future. Continue?`))return;
  const chunks=[];for(let i=0;i<items.length;i+=150)chunks.push(items.slice(i,i+150));
  try{
    for(const ch of chunks){
      await commit(ch.map(t=>({id:t.id,rev:t.rev||0,next:{...noId(t),eff:date,status:cfg.done,...(kind==='deposit'&&dref?{dref}:{}),...stamp()}})),
        {action:kind==='cheque'?'RELEASE':'DEPOSIT',summary:`${cfg.act==='Release'?'Released':'Deposited'} ${ch.length} item(s) totalling ${peso(ch.reduce((s,t)=>s+t.amt,0))} on ${fd(date)}`+(ch.length===1?` — ${ch[0].kind==='cheque'?'cheque #'+ch[0].no:''} ${ch[0].payee||''}`:'')});
    }
    ids.forEach(id=>{S.ui.sel.delete(id);delete S.ui.drafts[id]});
    toast(`${items.length} item(s) ${cfg.done}.`);
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- Bank ledger ---------- */
function vLedger(){
  const banks=visBanks(true);
  if(!banks.length)return '<div class="panel empty">No bank accounts yet.</div>';
  if(!S.ui.lBank||!banks.some(b=>b.id===S.ui.lBank))S.ui.lBank=banks[0].id;
  ensureLedger();
  const b=bankById(S.ui.lBank),from=S.ui.lFrom,to=S.ui.lTo;
  let body='<div class="empty">Loading…</div>',sumIn=0,sumOut=0,start=0,end=0,list=[];
  if(S.ledgerRows){
    const all=S.ledgerRows.filter(t=>t.bank===b.id&&t.status!=='void'&&t.eff&&t.eff>=from);
    const after=all.reduce((s,t)=>s+bankSign(t),0);
    const openIn=b.open_date&&b.open_date>=from;
    start=(b.bal||0)-after-(openIn?(b.open_amt||0):0);
    list=all.filter(t=>t.eff<=to).sort((x,y)=>x.eff<y.eff?-1:x.eff>y.eff?1:String(x.created_at||'').localeCompare(String(y.created_at||'')));
    if(openIn&&b.open_date<=to)list.unshift({opening:true,eff:b.open_date,amt:b.open_amt||0});
    let run=start;
    const tr=list.map(t=>{const v=t.opening?t.amt:bankSign(t);run+=v;if(v>=0)sumIn+=v;else sumOut-=v;t._run=run;
      if(t.opening)return `<tr><td class="num">${fd(t.eff)}</td><td><span class="pill p-mute">Opening</span></td><td></td><td>Opening balance</td><td class="n pos">${v>=0?peso(v):''}</td><td class="n">${v<0?peso(-v):''}</td><td class="n b">${peso(run)}</td></tr>`;
      return `<tr class="click" data-act="edit" data-id="${t.id}"><td class="num">${fd(t.eff)}</td><td>${typePill(t)}</td><td class="num">${h(t.kind==='cheque'?'#'+t.no:(t.ref||t.dref||''))}${t.kind==='cheque'&&t.ref?`<div class="small muted">${h(t.ref)}</div>`:''}</td>
      <td>${h(t.payee||'')}${t.note?`<div class="small muted">${h(t.note)}</div>`:''}</td><td class="n pos">${v>0?peso(v):''}</td><td class="n neg">${v<0?peso(-v):''}</td><td class="n b ${run<0?'neg':''}">${peso(run)}</td></tr>`}).join('');
    end=run;
    body=`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>No. / ref.</th><th>Payee / particulars</th><th class="n">Deposits &amp; credits</th><th class="n">Cheques &amp; debits</th><th class="n">Balance</th></tr></thead>
    <tbody><tr><td class="num">${fd(from)}</td><td></td><td></td><td class="b">Beginning balance</td><td></td><td></td><td class="n b">${peso(start)}</td></tr>${tr}</tbody>
    <tfoot><tr><td colspan="4">Ending balance ${fd(to)}</td><td class="n">${peso(sumIn)}</td><td class="n">${peso(sumOut)}</td><td class="n">${peso(end)}</td></tr></tfoot></table></div>
    ${S.ledgerRows.length>=10000?'<div class="note">Very long date range — choose a later "From" date for exact figures.</div>':''}`;
  }
  return `<div class="panel">
  <div class="row" style="margin-bottom:12px"><h1 style="margin:0">Bank ledger</h1><span class="spacer"></span>
    <select id="lBank" data-ui="lBank" aria-label="Bank account">${bankOptions(S.ui.lBank,{includeInactive:true})}</select>
    <label class="chk">From <input type="date" id="lFrom" data-ui="lFrom" value="${from}"></label>
    <label class="chk">To <input type="date" id="lTo" data-ui="lTo" value="${to}"></label>
    <button class="btn noprint" data-act="csvLedger">Export CSV</button><button class="btn noprint" data-act="print">Print</button></div>
  <p class="muted small" style="margin-top:0">${h(b.name)} · ${h([b.bank,b.acct_no].filter(Boolean).join(' · '))} — shows what has hit the bank: released cheques, deposited collections, bank debits and credits, by release / deposit date. Unreleased and undeposited items are not included until they are dated.</p>
  ${body}</div>`;
}
function typePill(t){
  if(t.status==='void')return '<span class="pill p-mute">Void</span>';
  if(t.xfer)return `<span class="pill p-info">Transfer ${t.kind==='debit'?'out':'in'}</span>`;
  const m={cheque:['Cheque','p-bad'],deposit:['Deposit','p-ok'],debit:['Debit','p-warn'],credit:['Credit','p-ok']}[t.kind]||[t.kind,'p-mute'];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}
function statusPill(t){
  switch(t.status){
    case 'unreleased':return '<span class="pill p-warn">Unreleased</span>';
    case 'released':return `<span class="pill p-ok">Released ${fd(t.eff)}</span>`;
    case 'undeposited':return '<span class="pill p-warn">Undeposited</span>';
    case 'deposited':return `<span class="pill p-ok">Deposited ${fd(t.eff)}</span>`;
    case 'void':return '<span class="pill p-mute">Void</span>';
    default:return '<span class="pill p-mute">Posted</span>';
  }
}

async function saveBank(f){
  const d=S.dlg,name=f.name.trim(),amt=parseAmt(f.open_amt||'0'),neg=/^\s*-/.test(f.open_amt);
  const open_amt=neg?-parseAmt(f.open_amt.replace('-','')):amt;
  if(!name)return toast('Enter the account name.',true);
  if(!Number.isFinite(open_amt))return toast('Enter a valid opening balance, e.g. 150000.00',true);
  if(!isISO(f.open_date))return toast('Enter the "as of" date.',true);
  const base={name,bank:f.bank.trim(),acct_no:f.acct_no.trim(),open_date:f.open_date,sort:parseInt(f.sort)||0,active:!!f.active,...stamp()};
  try{
    if(d.isNew){
      const id=Store.newId(C.banks);
      await Store.set(C.banks+'/'+id,{...base,open_amt,bal:open_amt,bbal:open_amt,unrel:0,unrel_n:0,undep:0,undep_n:0,created_at:nowISO(),created_by:S.user.name});
      logAudit('BANK_ADD',`Added bank account ${name} (opening ${peso(open_amt)} as of ${fd(f.open_date)})`,id);
    }else{
      const id=d.bank.id;let old;
      await Store.tx(async t=>{old=await t.get(C.banks+'/'+id);if(!old)throw new Error('Bank account not found.');
        const delta=open_amt-(old.open_amt||0);t.update(C.banks+'/'+id,{...base,open_amt,...(delta?{bal:Store.inc(delta),bbal:Store.inc(delta)}:{})})});
      const ch=[];if(old.open_amt!==open_amt)ch.push(`opening ${peso(old.open_amt)} → ${peso(open_amt)}`);if(old.open_date!==f.open_date)ch.push(`as of ${fd(old.open_date)} → ${fd(f.open_date)}`);if(old.name!==name)ch.push(`name ${old.name} → ${name}`);if((old.active!==false)!==!!f.active)ch.push(f.active?'activated':'deactivated');
      logAudit('BANK_EDIT',`Edited bank account ${name}${ch.length?': '+ch.join(', '):''}`,id);
    }
    closeDlg();toast('Bank account saved.');
  }catch(e){toast(errMsg(e),true)}
}
async function deleteBank(){
  const b=S.dlg.bank;
  try{
    const any=await Store.query(C.txns,[['bank','==',b.id]],{limit:1});
    if(any.length)return toast('This account has entries, so it cannot be deleted. Untick "Active" to hide it instead.',true);
    if(!confirm(`Delete bank account ${b.name}? This cannot be undone.`))return;
    await Store.del(C.banks+'/'+b.id);logAudit('BANK_DELETE',`Deleted bank account ${b.name}`,b.id);closeDlg();toast('Bank account deleted.');
  }catch(e){toast(errMsg(e),true)}
}
async function recalc(silentFix){
  try{
    if(!silentFix)toast('Checking all entries…');
    const all=await Store.query(C.txns,[]);
    const fixBd=all.filter(t=>(t.bd??null)!==bdOf(t));
    for(const t of fixBd){t.bd=bdOf(t);await Store.update(C.txns+'/'+t.id,{bd:t.bd})}
    const tot={};for(const b of S.banks)tot[b.id]={bal:b.open_amt||0,unrel:0,unrel_n:0,undep:0,undep_n:0,bbal:b.open_amt||0};
    for(const t of all){const e=effect(t);if(e&&tot[e.bank])for(const k of KEYS)tot[e.bank][k]+=e[k]||0}
    const diffs=S.banks.filter(b=>KEYS.some(k=>(b[k]??null)!==tot[b.id][k]));
    if(!diffs.length)return toast(`All ${S.banks.length} account balances are correct (${all.length} entries checked).`);
    if(silentFix){for(const b of diffs)await Store.update(C.banks+'/'+b.id,tot[b.id]);return}
    if(!confirm(`${diffs.length} account(s) have totals that do not match their entries:\n\n${diffs.map(b=>`${b.name}: shown ${peso(b.bal)}, entries give ${peso(tot[b.id].bal)}`).join('\n')}\n\nFix them now?`))return;
    for(const b of diffs)await Store.update(C.banks+'/'+b.id,tot[b.id]);
    logAudit('RECALC',`Fixed balances of ${diffs.map(b=>b.name).join(', ')}`);
    toast('Balances fixed.');
  }catch(e){toast(errMsg(e),true)}
}

/* ================= Searchable lists (customers, particulars) =================

function combo(name,list,value,{placeholder='',dis='',add='item'}={}){
  return `<div class="combo"><input type="text" name="${name}" value="${h(value)}" placeholder="${h(placeholder)}" autocomplete="off" data-combo="${list}" data-add="${add}" role="combobox" aria-autocomplete="list" aria-expanded="false" ${dis}><div class="combo-list" role="listbox"></div></div>`;
}
const LIST_LABEL={customers:'customer',particulars:'particular'};
async function listAdd(key,v,quiet){
  v=String(v||'').trim().replace(/\s+/g,' ');if(!v)return;
  const cur=S.lists[key]||[];if(cur.some(x=>x.toLowerCase()===v.toLowerCase()))return;
  S.lists[key]=[...cur,v].sort((a,b)=>a.localeCompare(b));
  const extra=key==='particulars'&&!S.lists.partDoc?DEFAULT_PARTICULARS:[];
  try{await Store.addToList(C.settings+'/'+key,...extra,v);if(!quiet)toast(`New ${LIST_LABEL[key]} added: ${v}`)}catch(e){toast(errMsg(e),true)}
}
async function listRemove(key,v){
  if(!confirm(`Remove "${v}" from the ${LIST_LABEL[key]} list? Entries that already use it are not changed.`))return;
  try{if(key==='particulars'&&!S.lists.partDoc)await Store.addToList(C.settings+'/'+key,...DEFAULT_PARTICULARS);await Store.removeFromList(C.settings+'/'+key,v);logAudit('LIST',`Removed ${LIST_LABEL[key]} "${v}"`)}catch(e){toast(errMsg(e),true)}
}
function comboShow(inp){
  const list=S.lists[inp.dataset.combo]||[],raw=inp.value.trim(),q=raw.toLowerCase(),box=inp.nextElementSibling;
  let m=q?list.filter(x=>x.toLowerCase().includes(q)).sort((a,b)=>(b.toLowerCase().startsWith(q)-a.toLowerCase().startsWith(q))||a.localeCompare(b)):list;
  m=m.slice(0,60);
  const mark=x=>{if(!q)return h(x);const i=x.toLowerCase().indexOf(q);return h(x.slice(0,i))+'<mark>'+h(x.slice(i,i+q.length))+'</mark>'+h(x.slice(i+q.length))};
  let html=m.map(x=>`<div class="combo-opt" role="option" data-v="${h(x)}">${mark(x)}</div>`).join('');
  if(q&&!list.some(x=>x.toLowerCase()===q))html+=`<div class="combo-opt combo-add" role="option" data-v="${h(raw)}" data-new="1">+ Add “${h(raw)}” as new ${h(inp.dataset.add)}</div>`;
  if(!html)html=`<div class="combo-empty muted small">No ${h(inp.dataset.add)}s yet. Type a name to add one.</div>`;
  box.innerHTML=html;box.classList.add('open');inp.setAttribute('aria-expanded','true');inp._act=-1;
}
function comboHide(inp){const box=inp&&inp.nextElementSibling;if(box&&box.classList.contains('combo-list')){box.classList.remove('open');inp.setAttribute('aria-expanded','false')}}
function comboPick(inp,opt){inp.value=opt.dataset.v;comboHide(inp);if(opt.dataset.new)listAdd(inp.dataset.combo,opt.dataset.v)}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.combo&&!e.target.disabled)comboShow(e.target)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.combo){const t=e.target;setTimeout(()=>comboHide(t),120)}});
document.addEventListener('mousedown',e=>{const o=e.target.closest('.combo-opt');if(!o)return;e.preventDefault();comboPick(o.closest('.combo').querySelector('input'),o)});
document.addEventListener('keydown',e=>{
  const inp=e.target;if(!inp.dataset||!inp.dataset.combo)return;
  const box=inp.nextElementSibling,opts=[...box.querySelectorAll('.combo-opt')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!box.classList.contains('open'))comboShow(inp);e.preventDefault();
    inp._act=Math.max(0,Math.min(opts.length-1,(inp._act??-1)+(e.key==='ArrowDown'?1:-1)));opts.forEach((o,i)=>o.classList.toggle('act',i===inp._act));opts[inp._act]&&opts[inp._act].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&box.classList.contains('open')&&inp._act>=0&&opts[inp._act]){e.preventDefault();comboPick(inp,opts[inp._act])}
  else if(e.key==='Escape'&&box.classList.contains('open')){e.stopImmediatePropagation();comboHide(inp)}
  else if(e.key==='Tab')comboHide(inp);
},true);

/* ================= Bank statement ================= */
function ensureStatement(){
  const key=S.ui.sFrom;
  if(S.sub.stmtKey!==key){S.sub.stmt&&S.sub.stmt();S.sub.stmtKey=key;S.stmtRows=null;
    S.sub.stmt=Store.listen(C.txns,[['bd','>=',key]],rows=>{S.stmtRows=rows;schedule()},onErr,{limit:10000})}
  if(!S.sub.pend)S.sub.pend=Store.listen(C.txns,[['bpend','==',true]],rows=>{S.pendRows=rows;schedule()},onErr,{limit:2000});
}
function stmtData(){
  const b=bankById(S.ui.sBank),from=S.ui.sFrom,to=S.ui.sTo;
  const all=(S.stmtRows||[]).filter(t=>t.bank===b.id&&t.bd&&t.bd>=from&&t.status!=='void');
  const openIn=b.open_date&&b.open_date>=from;
  let run=(b.bbal??b.bal??0)-all.reduce((x,t)=>x+bankSign(t),0)-(openIn?(b.open_amt||0):0);
  const start=run;
  const list=all.filter(t=>t.bd<=to).sort((x,y)=>x.bd<y.bd?-1:x.bd>y.bd?1:(x.eff||'')<(y.eff||'')?-1:(x.eff||'')>(y.eff||'')?1:String(x.created_at||'').localeCompare(String(y.created_at||'')));
  if(openIn&&b.open_date<=to)list.unshift({opening:true,bd:b.open_date,amt:b.open_amt||0});
  let sumIn=0,sumOut=0;
  for(const t of list){const v=t.opening?t.amt:bankSign(t);run+=v;if(v>=0)sumIn+=v;else sumOut-=v;t._v=v;t._run=run}
  const pend=(S.pendRows||[]).filter(t=>t.bank===b.id&&t.status!=='void'&&t.eff).sort((x,y)=>x.eff<y.eff?-1:1);
  return{b,from,to,start,end:run,list,sumIn,sumOut,pend};
}

      ${D.list.filter(match).map(t=>t.opening?`<tr><td class="num">${fd(t.bd)}</td><td></td><td><span class="pill p-mute">Opening</span></td><td></td><td>Opening balance</td><td class="n pos">${peso(t._v)}</td><td></td><td class="n b">${peso(t._run)}</td>${ed?'<td class="noprint"></td>':''}</tr>`

        <td>${h(t.payee||'')}${t.note?`<div class="small muted">${h(t.note)}</div>`:''}</td>
        <td class="n pos">${t._v>0?peso(t._v):''}</td><td class="n neg">${t._v<0?peso(-t._v):''}</td><td class="n b ${t._run<0?'neg':''}">${peso(t._run)}</td>

    pendHtml=`<div class="panel"><h2>Not yet in bank · ${D.pend.length}</h2>

      ${D.pend.map(t=>`<tr><td class="num">${fd(t.eff)}</td><td>${typePill(t)}</td><td class="num"><a href="#" data-act="edit" data-id="${t.id}">${h(t.kind==='cheque'?'#'+t.no:(t.ref||'—'))}</a></td><td>${h(t.payee||'')}</td>

  }
  return `<div class="panel">

    <label class="chk">From <input type="date" id="sFrom" data-ui="sFrom" value="${S.ui.sFrom}"></label>
    <label class="chk">To <input type="date" id="sTo" data-ui="sTo" value="${S.ui.sTo}"></label>
    <input type="search" id="sQ" data-ui="sQ" placeholder="Search" value="${h(S.ui.sQ)}" style="width:150px">
    <button class="btn noprint" data-act="csvStmt">Export CSV</button><button class="btn noprint" data-act="print">Print</button></div>
  <p class="muted small" style="margin-top:0">${h(b.name)} — every released cheque, deposited collection, debit, credit and transfer, arranged by the date it reflected in the bank. The bank date starts as the release / deposit date; change it here to match your actual bank statement.</p>
  ${b.bbal==null?'<div class="note">Bank balances are being prepared. An administrator must open the tracker once after this update.</div>':''}
  ${kp}${body}</div>${pendHtml}`;
}
async function setBankDate(id,{bdate,bpend}){
  let t=null;try{t=await Store.get(C.txns+'/'+id)}catch(e){}
  if(!t)return toast('Entry not found.',true);
  if(!canEdit())return;
  const b=bankById(t.bank);
  if(bdate&&b&&b.open_date&&bdate<b.open_date)return toast(`Bank date is before the opening date of ${b.name} (${fd(b.open_date)}).`,true);
  const next={...noId(t),bpend:!!bpend,...stamp()};if(bdate!==undefined)next.bdate=bdate||null;
  const what=t.kind==='cheque'?'cheque #'+t.no:(t.xfer?'transfer':KIND[t.kind].toLowerCase())+' '+(t.payee||'');
  try{await commit([{id,rev:t.rev||0,next}],{action:'BANK_DATE',summary:bpend?`Marked ${what} ${peso(t.amt)} as not yet in bank`:`Bank date of ${what} ${peso(t.amt)} set to ${fd(next.bdate||t.eff)}`});toast(bpend?'Moved to Not yet in bank.':'Bank date saved.')}
  catch(e){toast(errMsg(e),true)}
}

async function dlgEntry(id,kind){
  if(!id&&!kind)return;
  let t=null,legs=null;
  if(id){
    t=[...S.open,...(S.regRows||[]),...(S.ledgerRows||[])].find(x=>x.id===id);
    try{t=await Store.get(C.txns+'/'+id)||t}catch(e){}
    if(!t)return toast('Entry not found (it may have been deleted).',true);
    if(t.xfer){legs=await Store.query(C.txns,[['xfer','==',t.xfer]]);}
    kind=t.xfer?'transfer':t.kind;
  }
  kind=kind||'cheque';
  const banks=visBanks().filter(b=>b.active!==false||(t&&b.id===t.bank));
  if(!banks.length)return toast(isAdmin()?'Add a bank account first (Bank accounts tab).':'No bank account available to you.',true);
  S.dlg={id,t,legs,kind,rev:t?t.rev||0:0};
  drawEntry();
}

async function saveEntry(f,again){
  const d=S.dlg,kind=d.kind,isNew=!d.id;
  const amt=parseAmt(f.amt);
  if(!f.bank)return toast('Choose the bank account.',true);
  if(!canSee(f.bank))return toast('You do not have access to that account.',true);
  if(!isISO(f.date))return toast('Enter the date.',true);
  if(!Number.isFinite(amt)||amt<=0)return toast('Enter a valid amount, e.g. 12500.00',true);
  const eff=(kind==='cheque'||kind==='deposit')?(f.eff||null):f.date;
  if(eff&&!isISO(eff))return toast('Check the release / deposit date.',true);
  const banksToCheck=[f.bank];if(kind==='transfer')banksToCheck.push(f.xbank);
  for(const bid of banksToCheck){const b=bankById(bid);if(!b)return toast('Choose the bank account.',true);
    const first=kind==='cheque'||kind==='deposit'?eff:f.date;
    if(first&&b.open_date&&first<b.open_date)return toast(`${fd(first)} is before the opening date of ${b.name} (${fd(b.open_date)}). Change the date or the account's opening date.`,true)}
  const base={date:f.date,amt,ref:(f.ref||'').trim(),note:(f.note||'').trim(),payee:(f.payee||'').trim(),...stamp()};
  if(kind!=='transfer'){
    base.bdate=isISO(f.bdate)?f.bdate:null;base.bpend=!!f.bpend;
    const b0=bankById(f.bank);if(base.bdate&&b0&&b0.open_date&&base.bdate<b0.open_date)return toast(`Bank date ${fd(base.bdate)} is before the opening date of ${b0.name} (${fd(b0.open_date)}).`,true);
  }
  const created=isNew?{created_at:nowISO(),created_by:S.user.name}:{created_at:d.t.created_at||'',created_by:d.t.created_by||''};
  try{
    if(kind==='transfer'){
      if(!f.xbank||f.xbank===f.bank)return toast('Choose two different accounts.',true);
      if(isNew){
        const xfer=Store.newId(C.txns),a=Store.newId(C.txns),b=Store.newId(C.txns);
        const common={...base,...created,eff:f.date,status:'posted',xfer};
        await commit([{id:a,isNew:true,next:{...common,kind:'debit',bank:f.bank,xbank:f.xbank,payee:'Transfer to '+bankName(f.xbank)}},
                      {id:b,isNew:true,next:{...common,kind:'credit',bank:f.xbank,xbank:f.bank,payee:'Transfer from '+bankName(f.bank)}}],
          {action:'ADD',summary:`Transfer ${peso(amt)} from ${bankName(f.bank)} to ${bankName(f.xbank)} on ${fd(f.date)}`});
      }else{
        const ch=d.legs.map(l=>{const isOut=l.kind==='debit',bank=isOut?f.bank:f.xbank,x=isOut?f.xbank:f.bank;
          return{id:l.id,rev:l.rev||0,next:{...noId(l),...base,eff:f.date,bank,xbank:x,payee:(isOut?'Transfer to ':'Transfer from ')+bankName(x)}}});
        await commit(ch,{action:'EDIT',summary:`Edited transfer ${peso(amt)} ${bankName(f.bank)} → ${bankName(f.xbank)} on ${fd(f.date)}`});
      }
    }else{
      if(kind==='cheque'){
        if(!(f.no||'').trim())return toast('Enter the cheque number.',true);
        if(!base.payee)return toast('Enter the payee.',true);
        const no=f.no.trim();
        const dup=(await Store.query(C.txns,[['no','==',no]])).filter(x=>x.bank===f.bank&&x.id!==d.id&&x.kind==='cheque');
        if(dup.length&&!confirm(`Cheque #${no} already exists for ${bankName(f.bank)} (${dup.map(x=>`${fd(x.date)} ${x.payee} ${peso(x.amt)}${x.status==='void'?' – void':''}`).join('; ')}). Save anyway?`))return;
        base.no=no;
      }
      if(kind==='deposit'){
        base.dref=(f.dref||'').trim();base.pay=f.pay==='cheque'?'cheque':'cash';
        if(base.pay==='cheque'){base.chk_bank=(f.chk_bank||'').trim();base.chk_no=(f.chk_no||'').trim();base.chk_date=isISO(f.chk_date)?f.chk_date:'';
          if(!base.chk_no)return toast("Enter the customer's cheque number.",true)}
        else{base.chk_bank='';base.chk_no='';base.chk_date=''}
      }
      const id=isNew?Store.newId(C.txns):d.id;
      const prev=isNew?{}:noId(d.t);
      const next={...prev,...base,...created,kind,bank:f.bank,eff,status:statusOf(kind,eff)};
      const label=kind==='cheque'?`cheque #${base.no} ${base.payee}`:`${KIND[kind].toLowerCase()} ${base.payee||base.ref||''}`;
      let sum=`${isNew?'Added':'Edited'} ${label} ${peso(amt)} (${bankName(f.bank)})`;
      if(!isNew){const o=d.t,c=[];if(o.amt!==amt)c.push(`amount ${peso(o.amt)} → ${peso(amt)}`);if(o.date!==f.date)c.push(`date ${fd(o.date)} → ${fd(f.date)}`);if((o.eff||null)!==eff)c.push(`${kind==='cheque'?'release':'deposit'} date ${o.eff?fd(o.eff):'none'} → ${eff?fd(eff):'none'}`);if(o.bank!==f.bank)c.push(`account ${bankName(o.bank)} → ${bankName(f.bank)}`);if(c.length)sum+=': '+c.join(', ')}
      await commit([{id,isNew,rev:isNew?undefined:d.rev,next}],{action:isNew?'ADD':'EDIT',summary:sum});
      if(kind==='deposit'){if(base.payee)listAdd('customers',base.payee,true);if(base.note)listAdd('particulars',base.note,true)}
    }
    toast(isNew?'Entry saved.':'Changes saved.');
    if(again&&isNew){const keepBank=f.bank,keepDate=f.date;S.dlg={id:null,t:{bank:keepBank,date:keepDate},kind,rev:0};drawEntry();const el=$('#fEntry [name=no]')||$('#fEntry [name=amt]');el&&el.focus()}
    else closeDlg();
  }catch(e){toast(errMsg(e),true)}
}
async function voidEntry(unvoid){
  const d=S.dlg,t=d.t;let reason='';
  if(!unvoid){reason=prompt('Reason for voiding (e.g. spoiled cheque, wrong entry):','');if(reason===null)return}
  const items=d.legs||[t];
  const ch=items.map(x=>({id:x.id,rev:x.rev||0,next:unvoid?{...noId(x),status:statusOf(x.kind,x.eff),void_reason:null,voided_at:null,voided_by:null,...stamp()}
                                                          :{...noId(x),status:'void',void_reason:reason,voided_at:nowISO(),voided_by:S.user.name,...stamp()}}));
  if(unvoid)for(const x of items){if(x.kind==='cheque'||x.kind==='deposit')ch.find(c=>c.id===x.id).next.status=statusOf(x.kind,x.eff)}
  try{await commit(ch,{action:unvoid?'UNVOID':'VOID',summary:`${unvoid?'Restored':'Voided'} ${t.xfer?'transfer':(t.kind==='cheque'?'cheque #'+t.no:KIND[t.kind].toLowerCase())} ${t.payee||''} ${peso(t.amt)} (${bankName(t.bank)})${reason?' — '+reason:''}`});closeDlg();toast(unvoid?'Entry restored.':'Entry voided.')}
  catch(e){toast(errMsg(e),true)}
}
async function deleteEntry(){
  const d=S.dlg,t=d.t;
  if(!confirm('Delete this entry permanently? (Void keeps a record; delete removes it.)'))return;
  const items=d.legs||[t];
  try{await commit(items.map(x=>({id:x.id,rev:x.rev||0,next:null})),{action:'DELETE',summary:`Deleted ${t.xfer?'transfer':(t.kind==='cheque'?'cheque #'+t.no:KIND[t.kind].toLowerCase())} ${t.payee||''} ${peso(t.amt)} dated ${fd(t.date)} (${bankName(t.bank)})`});closeDlg();toast('Entry deleted.')}
  catch(e){toast(errMsg(e),true)}
}

/* ================= Dialog plumbing ================= */
function openDlg(html,state){if(state!==undefined)S.dlg=state;$('#dlg').innerHTML=html;$('#dlgwrap').classList.add('open');
  const first=$('#dlg input:not([type=hidden]):not([readonly]):not([disabled]),#dlg select:not([disabled])');setTimeout(()=>first&&first.focus(),30)}
function closeDlg(){$('#dlgwrap').classList.remove('open');$('#dlg').innerHTML='';S.dlg=null}
$('#dlgwrap').addEventListener('mousedown',e=>{if(e.target.id==='dlgwrap')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dlgwrap').classList.contains('open'))closeDlg()});

/* ================= Events ================= */
document.addEventListener('click',async e=>{
  const m=$('#umenu');if(m&&!m.contains(e.target))m.classList.remove('open');
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A'&&a!=='toLedger'&&a!=='toOpen')e.preventDefault();
  switch(a){
    case 'menu':m.classList.toggle('open');break;
    case 'signOut':signOut();break;
    case 'forgot':forgotPassword(($('#loginEmail')||{}).value);break;
    case 'myPw':m&&m.classList.remove('open');dlgMyPw();break;
    case 'new':{const pref=S.route==='undep'?'deposit':S.route==='unrel'?'cheque':null;dlgEntry(null,pref&&kindAllowed(pref)?pref:['cheque','deposit','debit'].find(kindAllowed));break}
    case 'edit':if(e.target.closest('input,button:not([data-act=edit])'))return;dlgEntry(id);break;
    case 'close':closeDlg();break;
    case 'payPick':{const box=$('#chkFields');if(box)box.style.display=el.value==='cheque'?'':'none';break}
    case 'kindPick':{const t=S.dlg.t||{};const form=$('#fEntry');if(form){const fdx=Object.fromEntries(new FormData(form));S.dlg.t={...t,bank:fdx.bank||t.bank,date:fdx.date||t.date,amt:parseAmt(fdx.amt)||t.amt,payee:fdx.payee,note:fdx.note,ref:fdx.ref}}S.dlg.kind=el.value;drawEntry();break}
    case 'toLedger':S.ui.lBank=id;break;
    case 'toOpen':S.ui.bank=id;break;
    case 'sel':el.checked?S.ui.sel.add(id):S.ui.sel.delete(id);render();break;
    case 'selAll':{const rows=openRows(S.route==='unrel'?'cheque':'deposit');if(el.checked)rows.forEach(r=>S.ui.sel.add(r.id));else S.ui.sel.clear();render();break}
    case 'oneDone':{const inp=document.getElementById('d_'+id);await markDone(el.dataset.kind,[id],inp?inp.value:today(),'');break}
    case 'bulkDone':await markDone(el.dataset.kind,[...S.ui.sel],S.ui.bulkDate,S.ui.bulkRef.trim());break;
    case 'void':voidEntry(false);break;
    case 'unvoid':voidEntry(true);break;
    case 'delEntry':deleteEntry();break;
    case 'bankNew':dlgBank(null);break;
    case 'bankEdit':dlgBank(bankById(id));break;
    case 'bankDel':deleteBank();break;
    case 'toggleInactive':S.ui.showInactive=el.checked;render();break;
    case 'recalc':recalc();break;
    case 'userNew':dlgUser(null);break;
    case 'userEdit':dlgUser(S.users.find(u=>u.id===id));break;
    case 'userReset':dlgReset(S.users.find(u=>u.id===id));break;
    case 'userDel':deleteUser(S.dlg.user.id,false);break;
    case 'userDelOld':deleteUser(id,true);break;
    case 'allBanksToggle':$('#bankList').style.display=el.checked?'none':'';break;
    case 'copyPw':try{await navigator.clipboard.writeText(el.dataset.pw);toast('Copied.')}catch(err){toast('Select the text and copy it.',true)}break;
    case 'print':window.print();break;
    case 'bpend':setBankDate(id,{bpend:true});break;
    case 'binbank':{const v=(document.getElementById('pb_'+id)||{}).value;if(!isISO(v))return toast('Enter the bank date.',true);setBankDate(id,{bdate:v,bpend:false});break}
    case 'listDel':listRemove(el.dataset.list,el.dataset.v);break;
    case 'csvStmt':{if(!S.stmtRows)return;const D=stmtData();csvDownload(`bank-statement-${D.b.name.replace(/[^\w-]+/g,'_')}-${D.from}-to-${D.to}.csv`,[['Bank date','Book date','Type','No./ref','APV/ref','Payee/customer','Particulars','Deposits & credits','Withdrawals','Balance'],[D.from,'','','','','Beginning balance','','','',plain(D.start)],...D.list.map(t=>t.opening?[t.bd,'','Opening','','','Opening balance','',plain(t._v),'',plain(t._run)]:[t.bd,t.eff,t.xfer?'Transfer':KIND[t.kind],t.kind==='cheque'?t.no:(t.ref||t.dref||''),t.kind==='cheque'?(t.ref||''):'',t.payee||'',t.note||'',t._v>0?plain(t._v):'',t._v<0?plain(-t._v):'',plain(t._run)])]);break}
    case 'csvOpen':{const k=el.dataset.kind,cfg=openCfg(k);csvDownload(`${cfg.status}-${today()}.csv`,[[cfg.date,k==='cheque'?'Cheque no.':'OR/ref',...(k==='cheque'?['APV/ref']:[]),`Account`,...(k==='deposit'?['Collected as','Customer bank','Customer cheque no.','Cheque date']:[]),cfg.party,'Particulars','Amount','Age (days)'],...openRows(k).map(t=>[t.date,k==='cheque'?t.no:t.ref,...(k==='cheque'?[t.ref||'']:[]),bankName(t.bank),...(k==='deposit'?[payOf(t)==='cheque'?'Cheque':'Cash',t.chk_bank||'',t.chk_no||'',t.chk_date||'']:[]),t.payee,t.note,plain(t.amt),daysBetween(t.date,today())])]);break}
    case 'csvReg':csvDownload(`entries-${S.ui.rFrom}-to-${S.ui.rTo}.csv`,[['Date','Type','Account','Other account','Cheque no.','Ref','Payee/source','Particulars','Amount','Status','Release/deposit date','Bank date','Deposit slip','Collected as','Customer bank','Customer cheque no.','Cheque date','Created by','Last changed by'],...regFiltered().map(t=>[t.date,t.xfer?(t.kind==='debit'?'Transfer out':'Transfer in'):KIND[t.kind],bankName(t.bank),t.xbank?bankName(t.xbank):'',t.no||'',t.ref||'',t.payee||'',t.note||'',plain(t.amt),t.status,t.kind==='cheque'||t.kind==='deposit'?(t.eff||''):'',t.bpend?'not yet in bank':(t.bd||''),t.dref||'',t.kind==='deposit'?(payOf(t)==='cheque'?'Cheque':'Cash'):'',t.chk_bank||'',t.chk_no||'',t.chk_date||'',t.created_by||'',t.updated_by||''])]);break;
    case 'csvLedger':{if(!S.ledgerRows)return;const b=bankById(S.ui.lBank);
      const all=S.ledgerRows.filter(t=>t.bank===b.id&&t.status!=='void'&&t.eff&&t.eff>=S.ui.lFrom);const openIn=b.open_date&&b.open_date>=S.ui.lFrom;
      let run=(b.bal||0)-all.reduce((s,t)=>s+bankSign(t),0)-(openIn?(b.open_amt||0):0);
      const list=all.filter(t=>t.eff<=S.ui.lTo).sort((x,y)=>x.eff<y.eff?-1:x.eff>y.eff?1:String(x.created_at||'').localeCompare(String(y.created_at||'')));
      const out=[['Date','Type','No./ref','Payee','Particulars','Deposits & credits','Cheques & debits','Balance'],[S.ui.lFrom,'','','Beginning balance','','','',plain(run)]];
      if(openIn&&b.open_date<=S.ui.lTo){run+=b.open_amt||0;out.push([b.open_date,'Opening','','Opening balance','',plain(b.open_amt),'',plain(run)])}
      for(const t of list){const v=bankSign(t);run+=v;out.push([t.eff,t.xfer?'Transfer':KIND[t.kind],t.kind==='cheque'?t.no:(t.ref||t.dref||''),t.payee||'',t.note||'',v>0?plain(v):'',v<0?plain(-v):'',plain(run)])}
      csvDownload(`ledger-${b.name.replace(/[^\w-]+/g,'_')}-${S.ui.lFrom}-to-${S.ui.lTo}.csv`,out);break}
    case 'csvAudit':csvDownload(`activity-${today()}.csv`,[['When','User','Action','Details'],...S.audit.map(a=>[a.at,a.by_name,a.action,a.summary])]);break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.combo){comboShow(el);return}
  if(el.dataset.draft){S.ui.drafts[el.dataset.draft]=el.value;return}
  if(el.dataset.ui&&(el.type==='search'||el.type==='text')){S.ui[el.dataset.ui]=el.value;if(el.dataset.ui!=='bulkRef')schedule()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bdate){const v=el.value;if(v&&!isISO(v))return;setBankDate(el.dataset.bdate,{bdate:v||null,bpend:false});return}
  if(el.name==='role'&&el.closest('#fUser')){const a=el.value==='ADMIN';$('#tabBox').style.display=a?'none':'';$('#tabAdminNote').style.display=a?'':'none';return}
  if(el.dataset.ui&&el.type!=='search'&&el.type!=='text'){
    const k=el.dataset.ui;
    if(el.type==='date'&&!isISO(el.value)){el.value=S.ui[k];return}
    S.ui[k]=el.value;
    if(k==='lFrom'&&S.ui.lTo<S.ui.lFrom)S.ui.lTo=S.ui.lFrom;
    if(k==='sFrom'&&S.ui.sTo<S.ui.sFrom)S.ui.sTo=S.ui.sFrom;
    if(k==='rFrom'&&S.ui.rTo<S.ui.rFrom)S.ui.rTo=S.ui.rFrom;
    if(k==='rTo'&&S.ui.rTo<S.ui.rFrom)S.ui.rFrom=S.ui.rTo;
    if(k==='bank')S.ui.sel=new Set();
    if(k!=='bulkDate')render();
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.target,f=Object.fromEntries(new FormData(form));
  const btns=form.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  try{
    switch(form.id){
      case 'fLogin':S.loginNote='';S.loginUser=f.email;try{await signIn(f.email,f.pw)}catch(err){S.loginNote=err.message;render()}break;
      case 'fSetup':{
        const email=String(f.email||'').trim().toLowerCase();S.loginUser=email;
        if(!isEmail(email)){toast('Enter a valid email address.',true);break}
        if(f.pw.length<8){toast('Use at least 8 characters.',true);break}
        if(f.pw!==f.pw2){toast('The two passwords do not match.',true);break}
        if(!(await setupNeeded())){S.phase='login';render();toast('Setup is already done. Please sign in.');break}
        S.settingUp=true;let au=null;
        try{
          try{au=await Auth.create(email,f.pw)}
          catch(err){if(!String(err.code||'').includes('email-already-in-use'))throw err;
            try{au=await Auth.signIn(email,f.pw)}catch(e2){throw new Error('That email already has a login with a different password. Use another email, or use "Forgot password" on the sign-in screen first.')}}
          await Store.tx(async t=>{
            t.set(C.users+'/'+au.uid,{email,name:(f.name||'').trim()||'Administrator',role:'ADMIN',banks:null,tabs:null,active:true,must_change:false,created_at:nowISO(),created_by:'setup'});
            t.set(C.settings+'/admin_lock',{uid:au.uid,at:nowISO()});
          });
          S.settingUp=false;S.justSignedIn=true;onAuth(au);
        }catch(err){S.settingUp=false;if(au)await Auth.signOut().catch(()=>{});S.loginNote=err.code?authMsg(err):err.message;showLogin()}
        break}
      case 'fMust':await setOwnPassword(f.pw,f.pw2,null);break;
      case 'fMyPw':await setOwnPassword(f.pw,f.pw2,f.cur);break;
      case 'fEntry':await saveEntry(f,e.submitter&&e.submitter.name==='again');break;
      case 'fBankAcct':await saveBank(f);break;
      case 'fUser':await saveUser(f);break;
      case 'fReset':await saveReset();break;
      case 'fList_customers':case 'fList_particulars':await listAdd(form.dataset.list,f.v);form.reset();break;
      case 'fOrg':try{await Store.set(C.settings+'/main',{...S.settings,org:(f.org||'').trim()});logAudit('SETTINGS',`Company name set to ${(f.org||'').trim()}`);toast('Saved.')}catch(err){toast(errMsg(err),true)}break;
    }
  }finally{btns.forEach(b=>{if(document.contains(b))b.disabled=false})}
});

/* ================= Start ================= */
(function boot(){
  try{Store=DEMO?makeLocal():makeRemote();Auth=DEMO?makeLocalAuth():makeRemoteAuth()}
  catch(e){$('#app').innerHTML=`<div class="login"><div class="panel"><h1>Cannot start</h1><p>${h(errMsg(e))}</p><p class="muted">Check the internet connection and reload.</p></div></div>`;return}
  Auth.onChange(onAuth);
})();
</script>
